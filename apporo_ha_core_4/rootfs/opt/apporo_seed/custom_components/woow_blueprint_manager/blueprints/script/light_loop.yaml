        brightness_12:
          name: 亮度 / Brightness
          description: |
            燈光亮度 (1-255)。

            Light brightness (1-255).
          default: 200
          selector:
            number:
              min: 1
              max: 255
              step: 1
        color_temp_12:
          name: 色溫 / Color Temperature
          description: |
            色溫（開爾文，2000-6500K）。數值越低越暖（黃光），越高越冷（白光）。

            Color temperature (Kelvin, 2000-6500K). Lower values are warmer (yellow), higher values are cooler (white).
          default: 3300
          selector:
            color_temp:
              min: 2000
              max: 6500
              unit: kelvin
        color_rgb_12:
          name: RGB顏色 / RGB Color
          description: |
            RGB顏色。設定黑色[0,0,0]表示使用色溫設定。

            RGB color. Set to black [0,0,0] to use color temperature setting instead.
          default: [0, 0, 0]
          selector:
            color_rgb: {}

mode: restart

variables:
  # Global settings
  lights: !input light_list
  is_sync: !input sync_mode
  delay_time: !input sync_delay
  transition: !input transition_seconds
  hold_time: !input hold_seconds
  cycles: !input cycle_count

  # Mode 1 (color_temp in Kelvin)
  state_1: !input state_1
  brightness_1: !input brightness_1
  color_temp_1: !input color_temp_1
  color_rgb_1: !input color_rgb_1

  # Mode 2 (color_temp in Kelvin)
  state_2: !input state_2
  brightness_2: !input brightness_2
  color_temp_2: !input color_temp_2
  color_rgb_2: !input color_rgb_2

  # Mode 3 (color_temp in Kelvin)
  state_3: !input state_3
  brightness_3: !input brightness_3
  color_temp_3: !input color_temp_3
  color_rgb_3: !input color_rgb_3

  # Mode 4 (color_temp in Kelvin)
  state_4: !input state_4
  brightness_4: !input brightness_4
  color_temp_4: !input color_temp_4
  color_rgb_4: !input color_rgb_4

  # Mode 5 (color_temp in Kelvin)
  state_5: !input state_5
  brightness_5: !input brightness_5
  color_temp_5: !input color_temp_5
  color_rgb_5: !input color_rgb_5

  # Mode 6 (color_temp in Kelvin)
  state_6: !input state_6
  brightness_6: !input brightness_6
  color_temp_6: !input color_temp_6
  color_rgb_6: !input color_rgb_6

  # Mode 7 (color_temp in Kelvin)
  state_7: !input state_7
  brightness_7: !input brightness_7
  color_temp_7: !input color_temp_7
  color_rgb_7: !input color_rgb_7

  # Mode 8 (color_temp in Kelvin)
  state_8: !input state_8
  brightness_8: !input brightness_8
  color_temp_8: !input color_temp_8
  color_rgb_8: !input color_rgb_8

  # Mode 9 (color_temp in Kelvin)
  state_9: !input state_9
  brightness_9: !input brightness_9
  color_temp_9: !input color_temp_9
  color_rgb_9: !input color_rgb_9

  # Mode 10 (color_temp in Kelvin)
  state_10: !input state_10
  brightness_10: !input brightness_10
  color_temp_10: !input color_temp_10
  color_rgb_10: !input color_rgb_10

  # Mode 11 (color_temp in Kelvin)
  state_11: !input state_11
  brightness_11: !input brightness_11
  color_temp_11: !input color_temp_11
  color_rgb_11: !input color_rgb_11

  # Mode 12 (color_temp in Kelvin)
  state_12: !input state_12
  brightness_12: !input brightness_12
  color_temp_12: !input color_temp_12
  color_rgb_12: !input color_rgb_12

  # Build modes list for iteration (color_temp values are now in Kelvin)
  modes:
    - state: "{{ state_1 }}"
      brightness: "{{ brightness_1 }}"
      color_temp: "{{ color_temp_1 }}"
      color_rgb: "{{ color_rgb_1 }}"
    - state: "{{ state_2 }}"
      brightness: "{{ brightness_2 }}"
      color_temp: "{{ color_temp_2 }}"
      color_rgb: "{{ color_rgb_2 }}"
    - state: "{{ state_3 }}"
      brightness: "{{ brightness_3 }}"
      color_temp: "{{ color_temp_3 }}"
      color_rgb: "{{ color_rgb_3 }}"
    - state: "{{ state_4 }}"
      brightness: "{{ brightness_4 }}"
      color_temp: "{{ color_temp_4 }}"
      color_rgb: "{{ color_rgb_4 }}"
    - state: "{{ state_5 }}"
      brightness: "{{ brightness_5 }}"
      color_temp: "{{ color_temp_5 }}"
      color_rgb: "{{ color_rgb_5 }}"
    - state: "{{ state_6 }}"
      brightness: "{{ brightness_6 }}"
      color_temp: "{{ color_temp_6 }}"
      color_rgb: "{{ color_rgb_6 }}"
    - state: "{{ state_7 }}"
      brightness: "{{ brightness_7 }}"
      color_temp: "{{ color_temp_7 }}"
      color_rgb: "{{ color_rgb_7 }}"
    - state: "{{ state_8 }}"
      brightness: "{{ brightness_8 }}"
      color_temp: "{{ color_temp_8 }}"
      color_rgb: "{{ color_rgb_8 }}"
    - state: "{{ state_9 }}"
      brightness: "{{ brightness_9 }}"
      color_temp: "{{ color_temp_9 }}"
      color_rgb: "{{ color_rgb_9 }}"
    - state: "{{ state_10 }}"
      brightness: "{{ brightness_10 }}"
      color_temp: "{{ color_temp_10 }}"
      color_rgb: "{{ color_rgb_10 }}"
    - state: "{{ state_11 }}"
      brightness: "{{ brightness_11 }}"
      color_temp: "{{ color_temp_11 }}"
      color_rgb: "{{ color_rgb_11 }}"
    - state: "{{ state_12 }}"
      brightness: "{{ brightness_12 }}"
      color_temp: "{{ color_temp_12 }}"
      color_rgb: "{{ color_rgb_12 }}"

sequence:
  # ═══════════════════════════════════════════════════════════════
  # 外層循環：循環次數 / Outer loop: cycle count
  # ═══════════════════════════════════════════════════════════════
  - alias: "循環執行 / Cycle through modes"
    repeat:
      count: "{{ cycles }}"
      sequence:
        # ═══════════════════════════════════════════════════════════
        # 內層循環：12個模式 / Inner loop: 12 modes
        # ═══════════════════════════════════════════════════════════
        - alias: "執行模式序列 / Execute mode sequence"
          repeat:
            for_each: "{{ modes }}"
            sequence:
              # 儲存當前模式資料 / Store current mode data
              - variables:
                  current_mode: "{{ repeat.item }}"
                  current_state: "{{ repeat.item.state }}"
                  current_brightness: "{{ repeat.item.brightness }}"
                  current_color_temp: "{{ repeat.item.color_temp }}"
                  current_color_rgb: "{{ repeat.item.color_rgb }}"
                  use_rgb: "{{ repeat.item.color_rgb != [0, 0, 0] }}"

              # 檢查此模式是否啟用 / Check if this mode is enabled (state = on)
              - choose:
                  # ─────────────────────────────────────────────────
                  # 狀態為開啟 / State is ON
                  # ─────────────────────────────────────────────────
                  - conditions:
                      - condition: template
                        value_template: "{{ current_state == true }}"
                    sequence:
                      - choose:
                          # ─────────────────────────────────────────
                          # 同步模式：依序控制每盞燈 / Sync mode: control each light sequentially
                          # ─────────────────────────────────────────
                          - conditions:
                              - condition: template
                                value_template: "{{ is_sync == true }}"
                            sequence:
                              - alias: "同步模式開燈 / Sync mode turn on"
                                repeat:
                                  for_each: "{{ lights }}"
                                  sequence:
                                    - choose:
                                        # 使用 RGB 顏色 / Use RGB color
                                        - conditions:
                                            - condition: template
                                              value_template: "{{ use_rgb }}"
                                          sequence:
                                            - service: light.turn_on
                                              target:
                                                entity_id: "{{ repeat.item }}"
                                              data:
                                                brightness: "{{ current_brightness }}"
                                                rgb_color: "{{ current_color_rgb }}"
                                                transition: "{{ transition }}"
                                      default:
                                        # 使用色溫（Kelvin）/ Use color temperature (Kelvin)
                                        - service: light.turn_on
                                          target:
                                            entity_id: "{{ repeat.item }}"
                                          data:
                                            brightness: "{{ current_brightness }}"
                                            color_temp_kelvin: "{{ current_color_temp }}"
                                            transition: "{{ transition }}"
                                    - delay:
                                        seconds: "{{ delay_time }}"
                        default:
                          # ─────────────────────────────────────────
                          # 非同步模式：所有燈同時變換 / Async mode: all lights change at once
                          # ─────────────────────────────────────────
                          - choose:
                              # 使用 RGB 顏色 / Use RGB color
                              - conditions:
                                  - condition: template
                                    value_template: "{{ use_rgb }}"
                                sequence:
                                  - alias: "非同步模式開燈(RGB) / Async mode turn on (RGB)"
                                    service: light.turn_on
                                    target:
                                      entity_id: "{{ lights }}"
                                    data:
                                      brightness: "{{ current_brightness }}"
                                      rgb_color: "{{ current_color_rgb }}"
                                      transition: "{{ transition }}"
                            default:
                              # 使用色溫（Kelvin）/ Use color temperature (Kelvin)
                              - alias: "非同步模式開燈(色溫) / Async mode turn on (color temp)"
                                service: light.turn_on
                                target:
                                  entity_id: "{{ lights }}"
                                data:
                                  brightness: "{{ current_brightness }}"
                                  color_temp_kelvin: "{{ current_color_temp }}"
                                  transition: "{{ transition }}"
                      # 停留時間 / Hold time
                      - delay:
                          seconds: "{{ hold_time }}"

                # ─────────────────────────────────────────────────────
                # 狀態為關閉 / State is OFF
                # ─────────────────────────────────────────────────────
                default:
                  - choose:
                      # 同步模式：依序關閉每盞燈 / Sync mode: turn off each light sequentially
                      - conditions:
                          - condition: template
                            value_template: "{{ is_sync == true }}"
                        sequence:
                          - alias: "同步模式關燈 / Sync mode turn off"
                            repeat:
                              for_each: "{{ lights }}"
                              sequence:
                                - service: light.turn_off
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    transition: "{{ transition }}"
                                - delay:
                                    seconds: "{{ delay_time }}"
                    default:
                      # 非同步模式：所有燈同時關閉 / Async mode: all lights turn off at once
                      - alias: "非同步模式關燈 / Async mode turn off"
                        service: light.turn_off
                        target:
                          entity_id: "{{ lights }}"
                        data:
                          transition: "{{ transition }}"
                  # 停留時間 / Hold time
                  - delay:
                      seconds: "{{ hold_time }}"
