blueprint:
  name: 燈光循環控制 / Light Loop Control
  description: |
    燈光循環控制腳本：以12組可自訂模式依序循環控制多盞燈，支援同步/非同步、RGB與色溫。
    Light Loop Control script: cycles through up to 12 user-defined modes on multiple lights with sync/async, RGB and color-temp support.

    ## 功能說明 / Functional Description
    此腳本藍圖可對一組燈光實體依序執行最多12種預設模式。每種模式可獨立設定開/關狀態、亮度(1-255)、色溫(2000-6500K)或RGB顏色。
    支援同步模式（逐盞控制，每盞間有延遲）與非同步模式（所有燈同時變化）。整個12模式序列可重複循環多次。
    This script blueprint cycles a list of light entities through up to 12 preset modes. Each mode independently configures on/off state,
    brightness (1-255), color temperature (2000-6500K Kelvin), or RGB color. Supports sync mode (sequential per-light with delay) and
    async mode (all lights change simultaneously). The full 12-mode sequence can repeat for multiple cycles.

    ## 呼叫方式 / Invocation
    透過 script.turn_on 服務呼叫或從自動化(automation)觸發。腳本模式為 restart（重新呼叫會中斷並重新執行）。
    Called via script.turn_on service or triggered from automations. Script mode is "restart" (re-invocation interrupts and restarts).

    ## 輸入參數 / Inputs
    - **light_list** (必填/Required): 要控制的燈光實體清單，domain: light，支援多選
    - **sync_mode** (選填/Optional, 預設 true): true=同步逐盞控制, false=非同步全部同時
    - **sync_delay** (選填/Optional, 預設 0.5s): 同步模式下每盞燈之間的延遲秒數 (0-30)
    - **transition_seconds** (選填/Optional, 預設 1s): 燈光狀態漸變過渡時間 (0-30)
    - **hold_seconds** (選填/Optional, 預設 2s): 每個模式完成後的停留時間 (0-60)
    - **cycle_count** (選填/Optional, 預設 1): 整個12模式序列的重複次數 (1-50)
    - **模式 1-12 / Mode 1-12** (各含4參數): state_N(on/off), brightness_N(1-255), color_temp_N(2000-6500K), color_rgb_N([R,G,B], [0,0,0]=使用色溫)

    ## 執行效果 / Effects
    外層迴圈依 cycle_count 重複；內層迴圈遍歷12個模式，跳過 state=false 的模式（關燈）。
    RGB 非 [0,0,0] 時使用 rgb_color，否則使用 color_temp_kelvin。每個模式執行後停留 hold_seconds。
    Outer loop repeats by cycle_count; inner loop iterates 12 modes. Modes with state=false turn lights off.
    Non-black RGB uses rgb_color; otherwise color_temp_kelvin is used. Each mode holds for hold_seconds after execution.

    ## 典型應用場景 / Use Cases
    - 派對/節慶燈光秀：設定多種 RGB 顏色循環，營造動態氛圍 / Party/holiday light shows with dynamic RGB cycling
    - 日夜模擬：逐步從暖色溫過渡到冷色溫再到關燈 / Day-night simulation transitioning warm-to-cool color temps
    - 展示空間輪播：多盞射燈依序亮滅突顯不同展品 / Showroom spotlight rotation highlighting different exhibits
  domain: script
  input:
    # ═══════════════════════════════════════════════════════════════
    # 全域設定 / Global Settings
    # ═══════════════════════════════════════════════════════════════
    light_list:
      name: 燈光清單 / Light List
      description: |
        選擇要控制的燈光（可多選）。

        Select lights to control (multiple selection allowed).
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    # ═══════════════════════════════════════════════════════════════
    # 時序設定 / Timing Settings
    # ═══════════════════════════════════════════════════════════════
    timing_settings:
      name: 時序設定 / Timing Settings
      icon: mdi:timer-cog
      collapsed: true
      input:
        sync_mode:
          name: 同步模式 / Sync Mode
          description: |
            開啟：燈光依序變換，每盞燈之間有延遲時間。
            關閉：所有燈光同時變換，無延遲。

            On: Lights change sequentially with delay between each.
            Off: All lights change simultaneously without delay.
          default: true
          selector:
            boolean: {}

        sync_delay:
          name: 同步延遲（秒）/ Sync Delay (seconds)
          description: |
            同步模式下，控制完一盞燈後等待的時間，再控制下一盞燈。
            僅在同步模式開啟時生效。

            Time to wait after controlling one light before controlling the next.
            Only effective when sync mode is enabled.
          default: 0.5
          selector:
            number:
              min: 0
              max: 30
              step: 0.1
              unit_of_measurement: s

        transition_seconds:
          name: 過渡時間（秒）/ Transition Time (seconds)
          description: |
            燈光從當前狀態變換到目標狀態的漸變時間。
            較長的過渡時間會產生更平滑的視覺效果。

            Fade time for lights to transition from current state to target state.
            Longer transition time creates smoother visual effects.
          default: 1
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: s

        hold_seconds:
          name: 停留時間（秒）/ Hold Time (seconds)
          description: |
            每個模式執行完成後，維持當前狀態的時間，再進入下一個模式。

            Time to maintain current state after each mode completes, before moving to next mode.
          default: 2
          selector:
            number:
              min: 0
              max: 60
              step: 0.5
              unit_of_measurement: s

        cycle_count:
          name: 循環次數 / Cycle Count
          description: |
            整個12模式序列執行完一輪後，重新從模式1開始的重複次數。
            設為1表示只執行一次完整序列。

            Number of times to repeat the entire 12-mode sequence.
            Set to 1 to run the complete sequence only once.
          default: 1
          selector:
            number:
              min: 1
              max: 50
              step: 1

    # ═══════════════════════════════════════════════════════════════
    # 模式 1 / Mode 1
    # ═══════════════════════════════════════════════════════════════
    mode_1:
      name: 模式 1 / Mode 1
      icon: mdi:numeric-1-circle
      collapsed: true
      input:
        state_1:
          name: 開關 / On/Off
          description: |
            此模式是否開啟燈光。

            Whether lights are on in this mode.
          default: true
          selector:
            boolean: {}
        brightness_1:
          name: 亮度 / Brightness
          description: |
            燈光亮度 (1-255)。

            Light brightness (1-255).
          default: 200
          selector:
            number:
              min: 1
              max: 255
              step: 1
        color_temp_1:
          name: 色溫 / Color Temperature
          description: |
            色溫（開爾文，2000-6500K）。數值越低越暖（黃光），越高越冷（白光）。

            Color temperature (Kelvin, 2000-6500K). Lower values are warmer (yellow), higher values are cooler (white).
          default: 3300
          selector:
            color_temp:
              min: 2000
              max: 6500
              unit: kelvin
        color_rgb_1:
          name: RGB顏色 / RGB Color
          description: |
            RGB顏色。設定黑色[0,0,0]表示使用色溫設定。

            RGB color. Set to black [0,0,0] to use color temperature setting instead.
          default: [0, 0, 0]
          selector:
            color_rgb: {}

