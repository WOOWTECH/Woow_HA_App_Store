# Base = the shared WoowTech OpenDesign core image (see Dockerfile), published
# as ghcr.io/woowtech/open-design-core. Supervisor's local builder rejects OCI
# digest syntax here and silently falls back to its default base image, so this
# development path needs a tag: the core's immutable GHCR tag (same image as
# the digest in Dockerfile / CI, which pin the core by digest). amd64 only.
build_from:
  amd64: ghcr.io/woowtech/open-design-core:20261029.0033
labels:
  org.opencontainers.image.title: Woow HA OpenDesign
  org.opencontainers.image.description: OpenDesign 0.24.1 (WoowTech core) for Home Assistant Ingress
  org.opencontainers.image.vendor: WOOWTECH
  org.opencontainers.image.authors: WoowTech <ops@woowtech.com>
  org.opencontainers.image.source: https://github.com/WOOWTECH/Woow_ha_opendesign_add_on
  org.opencontainers.image.licenses: Apache-2.0 AND MIT
