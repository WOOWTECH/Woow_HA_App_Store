<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>OpenDesign 匯出驗證 🎨</title>
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    .slide { box-sizing: border-box; width: 640px; height: 360px; padding: 40px; color: #ffffff; font: 32px sans-serif; }
    .slide:first-of-type { background: #165DBA; }
    .slide:last-of-type { background: #AA3333; }
    .slide-number { display: block; margin-top: 180px; font-size: 20px; }
  </style>
</head>
<body>
  <section class="slide">第一張 / Slide one<span class="slide-number">1 / 2</span></section>
  <section class="slide">第二張 / Slide two<span class="slide-number">2 / 2</span></section>
</body>
</html>
