daemon off;
pid /tmp/ha-opendesign-nginx/nginx.pid;
worker_processes 1;
# `stderr` is nginx's inherited-fd special target. HA Supervisor's log pipe
# cannot be reopened through /dev/stderr after the launcher drops to the
# unprivileged ha-ingress UID.
error_log stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid reopening HA's root-owned stdout pipe after dropping privileges.
    # Error and lifecycle logs remain available in the add-on Logs tab.
    access_log off;
    server_tokens off;
    # Redirects must stay relative: HA's browser origin is not nginx's
    # internal host:8099, so an absolute Location would leave the ingress.
    absolute_redirect off;

    client_body_temp_path /tmp/ha-opendesign-nginx/client;
    proxy_temp_path /tmp/ha-opendesign-nginx/proxy;
    fastcgi_temp_path /tmp/ha-opendesign-nginx/fastcgi;
    uwsgi_temp_path /tmp/ha-opendesign-nginx/uwsgi;
    scgi_temp_path /tmp/ha-opendesign-nginx/scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 256M;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    sub_filter_once off;
    sub_filter_last_modified on;
    # OpenDesign 0.21.1 serves Turbopack chunks as text/javascript.
    sub_filter_types text/css text/javascript application/javascript application/x-javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Only a Supervisor-shaped prefix may enter response bodies or JavaScript.
    map $http_x_ingress_path $safe_ingress_path {
        default "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$" $http_x_ingress_path;
    }

    # The daemon sees nginx's loopback Host, while the browser uses HA's public
    # origin. Modern browsers attest same-origin with Sec-Fetch-Site. For older
    # WebViews, compare Origin to the actual incoming Host byte for byte.
    # Cross-site metadata always yields a rejecting Origin, even when absent.
    map "$http_origin|$http_host" $native_origin_matches_host {
        default 0;
        "~*^https?://([^|/]+)\|\1$" 1;
    }
    map "$http_sec_fetch_site|$native_origin_matches_host" $native_api_origin {
        "same-origin|0" "";
        "same-origin|1" "";
        "|1" "";
        "same-site|0" "null";
        "same-site|1" "null";
        "cross-site|0" "null";
        "cross-site|1" "null";
        default $http_origin;
    }

    server {
        listen 8099 default_server;

        # Only the Supervisor's Ingress gateway (172.30.32.2) and processes inside
        # this container (127.0.0.1) may use the routes below. Before 0.2.12 only
        # /mcp-admin and Paseo checked the peer, so any other container on the
        # hassio network, and Home Assistant Core on the host network, reached the
        # OpenDesign UI and API, the writable /console/ terminal and the Omnigent
        # API with no credentials. A location that declares its own allow/deny
        # (/mcp-admin, Paseo) replaces these rules and still refuses loopback.
        # Note: `return` runs in nginx's rewrite phase, before allow/deny, so the
        # redirect-only locations below (/console, /terminal, /mcp-admin,
        # /_woow/support) answer any peer with a bare redirect and expose nothing;
        # tests/validate.py requires every `return` in this block to be a redirect
        # (301/302) or a bare 403, never a content response.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        location = /ha-ingress.js {
            alias /opt/ha-opendesign/ha-ingress.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location = /ha-export-bridge.js {
            alias /opt/ha-opendesign/ha-export-bridge.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        # The core's white-label patch points "Contact us" at the same-origin
        # /_woow/support path; the PaaS auth proxy answers it with a redirect
        # to whiteLabel.supportUrl. Answer it here the same way.
        location = /_woow/support {
            return 302 https://aiot.woowtech.io/woow;
        }

        # Interactive agent login shell (the built-in "CLI Terminal" plugin on
        # OpenDesign's Plugins page opens it). Home Assistant strips its
        # ingress token before forwarding and restores it in X-Ingress-Path;
        # ttyd is loopback-only and its public asset/WebSocket paths are
        # re-prefixed. /console/ is the path shared with the WOOW PaaS build.
        location = /console {
            return 302 $safe_ingress_path/console/;
        }

        location ^~ /console/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:7681;
            proxy_set_header Origin http://127.0.0.1:7681;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter '"/console/' '"$safe_ingress_path/console/';
            sub_filter "'/console/" "'$safe_ingress_path/console/";
        }

        # Before 0.2.5 the terminal lived at /terminal/; keep old links working.
        location = /terminal {
            return 302 $safe_ingress_path/console/;
        }

        location ^~ /terminal/ {
            return 302 $safe_ingress_path/console/;
        }

        # Built-in MCP server administration (token reveal/rotate/revoke, tool
        # policy). Only the Supervisor Ingress peer may enter; the MCP gateway
        # behind the Unix socket also requires the Ingress user header and a
        # CSRF token. Accepted risk (owner decision 2026-10-14): no separate HA
        # admin-role check, so any HA user who can open this add-on's Ingress
        # can reach it. The socket is not reachable from UID 1001.
        location = /mcp-admin {
            allow 172.30.32.2;
            deny all;
            return 302 $safe_ingress_path/mcp-admin/;
        }

        location ^~ /mcp-admin/ {
            allow 172.30.32.2;
            deny all;
            proxy_pass http://unix:/run/ha-opendesign-mcp/admin.sock:/;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Connection "";
            proxy_set_header Origin "";
            proxy_set_header X-Ingress-Path $safe_ingress_path/mcp-admin;
            proxy_set_header Accept-Encoding "";
            proxy_buffering on;
            proxy_read_timeout 60s;
        }

        # Native Paseo launcher and bridge. Authentication stays at Supervisor;
        # the shared runtime validates the sanitized user/origin/subpath context.
        # Prefix matching also routes malformed suffixes to fail-closed validation.
        location = /paseo/setup {
            include /etc/nginx/paseo-setup.conf;
        }
        location = /paseo/setup/ {
            include /etc/nginx/paseo-setup.conf;
        }
        location ^~ /paseo {
            include /etc/nginx/paseo-proxy.conf;
        }

        location ^~ /api/paseo-bridge {
            include /etc/nginx/paseo-proxy.conf;
        }

        # Exported HTML and binary artifacts must remain byte-for-byte portable;
        # do not apply the application-shell body filters to download routes.
        location ~ ^/api/projects/[^/]+/export(?:/|$) {
            proxy_pass http://127.0.0.1:7456;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:7456;
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $safe_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
        }

        location / {
            proxy_pass http://127.0.0.1:7456;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:7456;
            proxy_set_header Origin $native_api_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $safe_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            # Rewrite URLs parsed before the shim can intercept dynamic calls.
            sub_filter 'href="/' 'href="$safe_ingress_path/';
            sub_filter 'src="/' 'src="$safe_ingress_path/';
            sub_filter 'action="/' 'action="$safe_ingress_path/';
            sub_filter "href='/" "href='$safe_ingress_path/";
            sub_filter "src='/" "src='$safe_ingress_path/";
            sub_filter "action='/" "action='$safe_ingress_path/";
            sub_filter 'href=\"/' 'href=\"$safe_ingress_path/';
            sub_filter 'src=\"/' 'src=\"$safe_ingress_path/';
            # Keep Turbopack's runtime asset base and RSC module references on
            # the public ingress prefix; otherwise the initial chunks download
            # but the Next client never consumes the flight payload.
            sub_filter '\"/_next/' '\"$safe_ingress_path/_next/';
            sub_filter '"/_next/' '"$safe_ingress_path/_next/';
            sub_filter 'url(/' 'url($safe_ingress_path/';
            # OpenDesign 0.24.1 builds agent/model icon URLs in template
            # literals and applies them as React inline mask-image styles.
            # Chromium may fetch such a style during the same commit, before
            # the client shim's MutationObserver can re-scope it.
            sub_filter '`/agent-icons/' '`$safe_ingress_path/agent-icons/';
            sub_filter '`/model-icons/' '`$safe_ingress_path/model-icons/';

            # This is inserted at the first head byte, before upstream scripts.
            sub_filter '<head>' '<head><script>window.__OD_INGRESS_PATH__="$safe_ingress_path";</script><script src="$safe_ingress_path/ha-ingress.js"></script><script src="$safe_ingress_path/ha-export-bridge.js"></script>';
        }
    }
}
