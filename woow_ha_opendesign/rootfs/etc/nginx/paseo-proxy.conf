# Only the actual Supervisor peer can supply authenticated HA context. Do not
# use real_ip_header or a forwarded address to satisfy this access rule.
allow 172.30.32.2;
deny all;
if ($safe_ingress_path = "") { return 403; }
proxy_pass http://unix:/run/ha-opendesign-paseo/bridge.sock;
proxy_http_version 1.1;
# Allowlist headers: client-supplied proxy context, authorization and cookies
# never enter the bridge. The browser Host is preserved by Core/Supervisor.
proxy_pass_request_headers off;
proxy_set_header Host $http_host;
proxy_set_header X-OD-HA-Peer $remote_addr;
proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
proxy_set_header X-Ingress-Path $safe_ingress_path;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
proxy_set_header Content-Type $content_type;
proxy_set_header Content-Length $content_length;
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_buffering off;
proxy_redirect off;
