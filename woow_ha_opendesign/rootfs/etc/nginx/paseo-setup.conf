# HA-only response adaptation; the immutable shared runtime stays untouched.
include /etc/nginx/paseo-proxy.conf;
include /run/ha-opendesign-return/back-link.conf;
sub_filter_once on;
sub_filter '<a href="$safe_ingress_path/plugins" class="back-link">← 返回外掛</a>' '<a href="$ha_return_path" class="back-link">$ha_return_label</a>';
