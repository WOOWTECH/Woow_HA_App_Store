blueprint:
  name: 場景循環 - 詳細版
  description: |
    虛擬開關控制場景循環播放器，每個場景可獨立設定轉場與維持時間 (最多10組)。

    ## 功能說明 / Functional Description
    透過 input_boolean 虛擬開關控制最多 10 個 Scene 的循環播放。每個場景可
    獨立設定 transition (轉場秒數) 與 hold (維持秒數)，開關 ON 時持續循環，
    OFF 時立即停止。Scene loop player controlled by input_boolean toggle.
    Supports up to 10 scenes with individual transition and hold time settings.
    Loops continuously while switch is ON; stops immediately when turned OFF.

    ## 觸發方式 / Trigger
    - trigger: state，監控 input_boolean 從 off 變為 on
    - 自動化模式: restart (重新觸發時重新開始循環)

    ## 輸入參數 / Inputs
    - **input_boolean_entity** (必填): 虛擬開關實體 (domain: input_boolean)
    - **scene_entity_1~10** (選填): 最多 10 個場景實體 (domain: scene)
    - **transition_time_1~10** (選填, 預設 5秒): 各場景轉場時間 (0-1800秒)
    - **hold_time_1~10** (選填, 預設 60秒): 各場景維持時間 (0-1800秒)
    - **after/before_this_time** (選填, 預設全天): 生效時間窗口
    - **condition_weekday** (選填, 預設每天): 生效星期
    - **global_conditions** (選填): 額外自訂條件

    ## 執行效果 / Effects
    1. 檢查時間/星期/全域條件，不符合則不執行
    2. 外層 while 迴圈：只要 input_boolean 保持 ON 就持續循環
    3. 內層 repeat(10)：依序對 scene_1~10 呼叫 scene.turn_on + delay
    4. 空場景自動跳過，僅執行有設定的場景步驟

    ## 典型應用場景 / Use Cases
    - 商店展示燈光循環：多組氣氛場景輪播吸引顧客
    - 派對/活動情境：彩色燈光場景自動循環切換
    - 水族箱/植物燈模擬日照：不同色溫場景漸變循環
  domain: automation
  author: WOOW TECH CO., LTD.
  input:
    ###################################################################
    # 基本：Input Boolean 觸發
    ###################################################################
    input_boolean_entity:
      name: 虛擬開關 (Input Boolean)
      description: 開啟 → 開始循環；關閉 → 停止
      selector:
        entity: { filter: { domain: input_boolean } }

    ###################################################################
    # Scene 1‑10：transition ＋ hold 秒數
    ###################################################################
    scene_1:
      name: 場景1
      icon: mdi:palette
      collapsed: true
      input:
        transition_time_1:
          name: transition (秒)
          default: 5
          selector: { number: { mode: slider, min: 0, max: 1800, step: 1 } }
        scene_entity_1:
          name: 場景1
          default: []
          selector: { entity: { filter: { domain: scene } } }
        hold_time_1:
          name: 維持時間 (秒)
          default: 60
          selector: { number: { mode: slider, min: 0, max: 1800, step: 1 } }

    scene_2:
      name: 場景2
