        desc_en: "Advanced scene loop with custom timing and transitions"
        category: "scene"
# ─────────────────── 變數 ───────────────────
variables:
  _boolean: !input input_boolean_entity

  transition_time_list:
    - !input transition_time_1
    - !input transition_time_2
    - !input transition_time_3
    - !input transition_time_4
    - !input transition_time_5
    - !input transition_time_6
    - !input transition_time_7
    - !input transition_time_8
    - !input transition_time_9
    - !input transition_time_10
  scene_entity_list:
    - !input scene_entity_1
    - !input scene_entity_2
    - !input scene_entity_3
    - !input scene_entity_4
    - !input scene_entity_5
    - !input scene_entity_6
    - !input scene_entity_7
    - !input scene_entity_8
    - !input scene_entity_9
    - !input scene_entity_10
  hold_time_list:
    - !input hold_time_1
    - !input hold_time_2
    - !input hold_time_3
    - !input hold_time_4
    - !input hold_time_5
    - !input hold_time_6
    - !input hold_time_7
    - !input hold_time_8
    - !input hold_time_9
    - !input hold_time_10

# ─────────────────── 觸發 ───────────────────
triggers:
  - trigger: state
    entity_id: !input input_boolean_entity
    from: "off"
    to: "on"

# ─────────────────── 動作 ───────────────────
actions:
  # 時間 & 額外全域條件檢查
  - condition: time
    after: !input after_this_time
    before: !input before_this_time
    weekday: !input condition_weekday
  - condition: !input global_conditions

  # 只要開關保持 ON，就一直循環播放場景
  - repeat:
      while:
        - condition: state
          entity_id: !input input_boolean_entity
          state: "on"
      sequence:
        - repeat:
            count: 10
            sequence:
              - condition: state
                entity_id: !input input_boolean_entity
                state: "on"
              - variables:
                  _idx: "{{ repeat.index - 1 }}"
                  _transition: "{{ transition_time_list[_idx] | int }}"
                  _scene: "{{ scene_entity_list[_idx] }}"
                  _hold: "{{ hold_time_list[_idx] | int }}"
              - if: "{{ _scene | length > 0 }}"
                then:
                  - action: scene.turn_on
                    data:
                      entity_id: "{{ _scene }}"
                      transition: "{{ _transition }}"
                  - delay: "{{ _hold }}"

# ─────────────────── 其他 ───────────────────
mode: restart
