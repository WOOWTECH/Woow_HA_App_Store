name: Woow Collabora CODE
version: 26.04.4.1.1
slug: woow-collabora
description: Collabora Online office suite for Woow Nextcloud Office
url: https://github.com/WOOWTECH/Woow_HA_App_Store
image: ghcr.io/alexbelgium/collabora-{arch}
init: false
startup: services
stage: stable
arch:
  - aarch64
  - amd64

# Admin UI in Home Assistant sidebar. The WOPI/Office endpoint should still use
# the direct port/public hostname, not the HA ingress token URL.
ingress: true
ingress_panel: false
ingress_port: 9980
ingress_entry: browser/dist/admin/admin.html
ingress_stream: true
panel_icon: mdi:file-document-edit-outline
panel_title: Woow Collabora
panel_admin: false

webui: "[PROTO:ssl]://[HOST]:[PORT:9980]/browser/dist/admin/admin.html"
watchdog: "http://[HOST]:[PORT:9980]/hosting/capabilities"

ports:
  9980/tcp: 9981
ports_description:
  9980/tcp: Collabora WOPI/Admin endpoint for Nextcloud Office

map:
  - type: addon_config
    read_only: false
  - type: ssl
    read_only: true

environment:
  PUID: "0"
  PGID: "0"

options:
  env_vars: []
  aliasgroup1: "http://homeassistant:8000"
  aliasgroup2: ""
  aliasgroup3: ""
  certfile: fullchain.pem
  keyfile: privkey.pem
  server_name: "homeassistant:9981"
  ssl: false
  ssl_termination: false
  username: admin
  password: ""
  extra_params: >-
    --o:ssl.enable=false --o:ssl.termination=false
    --o:user_interface.use_integration_theme=false --o:net.proto=IPv4
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  TZ: str?
  aliasgroup1: str
  aliasgroup2: str?
  aliasgroup3: str?
  cert_domain: str?
  certfile: str
  dictionaries: str?
  domain1: str?
  extra_params: str?
  keyfile: str
  password: password
  server_name: str?
  ssl: bool
  ssl_termination: bool?
  username: str
