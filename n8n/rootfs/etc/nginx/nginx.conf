daemon off;
pid /var/run/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_ingress_path $safe_ingress_path {
        default "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$" $http_x_ingress_path;
    }

    server {
        listen 5690 default_server;
        allow 172.30.32.2;
        deny all;

        client_max_body_size 200M;

        location / {
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $scheme://$http_host;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_redirect ~^(/.*)$ $safe_ingress_path$1;

            sub_filter_once off;
            sub_filter_types application/javascript text/javascript text/css;
            sub_filter 'href="/' 'href="$safe_ingress_path/';
            sub_filter 'src="/' 'src="$safe_ingress_path/';
            sub_filter 'data-src="/' 'data-src="$safe_ingress_path/';
            sub_filter "window.BASE_PATH = '/';" "window.BASE_PATH = '$safe_ingress_path/';";

            # n8n's Vue router and lazy chunks still create root-absolute URLs
            # at runtime. Keep those requests inside the HA ingress iframe.
            sub_filter '</head>' '<base href="$safe_ingress_path/"><script>window.__INGRESS_PATH__="$safe_ingress_path";(function(){var P=window.__INGRESS_PATH__||"";if(!P)return;var path=function(u){if(typeof u!=="string")return u;try{var x=new URL(u,location.href);if(x.origin===location.origin){var q=x.pathname+x.search+x.hash;if(q.indexOf(P)===0)return q;if(q.charAt(0)==="/")return P+q}}catch(e){}return u};var F=window.fetch;window.fetch=function(i,o){if(typeof i==="string")i=path(i);else if(i instanceof URL)i=path(i.href);else if(i&&i.url){var u=path(i.url);if(u!==i.url)i=new Request(u,i)}return F(i,o)};var X=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){arguments[1]=path(u);return X.apply(this,arguments)};var H=function(fn){return function(s,t,u){if(typeof u==="string")arguments[2]=path(u);return fn.apply(this,arguments)}};history.pushState=H(history.pushState);history.replaceState=H(history.replaceState);var A=Element.prototype.setAttribute;Element.prototype.setAttribute=function(n,v){if((n==="href"||n==="src")&&typeof v==="string")v=path(v);return A.call(this,n,v)};var W=window.WebSocket;window.WebSocket=function(u,p){var s=String(u),h=location.host;if(s.indexOf("ws://"+h)===0||s.indexOf("wss://"+h)===0){var x=new URL(s);if(x.pathname.indexOf(P)!==0)x.pathname=P+x.pathname;s=x.toString()}return p===undefined?new W(s):new W(s,p)};window.WebSocket.prototype=W.prototype;})()</script></head>';
        }
    }
}
