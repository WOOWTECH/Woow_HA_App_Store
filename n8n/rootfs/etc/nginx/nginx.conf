daemon off;
pid /var/run/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_ingress_path $safe_ingress_path {
        default "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$" $http_x_ingress_path;
    }

    server {
        listen 5690 default_server;
        allow 172.30.32.2;
        deny all;

        client_max_body_size 200M;

        location / {
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $scheme://$http_host;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_redirect ~^(/.*)$ $safe_ingress_path$1;

            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript text/css;
            sub_filter 'href="/' 'href="$safe_ingress_path/';
            sub_filter 'src="/' 'src="$safe_ingress_path/';
            sub_filter 'data-src="/' 'data-src="$safe_ingress_path/';
            sub_filter "window.BASE_PATH = '/';" "window.BASE_PATH = '$safe_ingress_path/';";
        }
    }
}
