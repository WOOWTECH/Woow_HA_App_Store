configuration:
  N8N_LOG_LEVEL:
    name: 日誌等級
    description: 設定 n8n 的日誌輸出等級。可選項：error（僅錯誤）、warn（警告）、info（一般資訊）、debug（除錯模式）。
  TZ:
    name: 時區
    description: n8n 實例的時區設定，用於正確顯示日期和時間。若未設定，預設為 UTC。建議設為 Asia/Taipei。
  GENERIC_TIMEZONE:
    name: 通用時區
    description: 排程節點（Schedule node）使用的預設時區，用於判斷工作流程應在何時啟動。預設為 America/New_York，建議改為 Asia/Taipei。
  N8N_HOST:
    name: 主機位址
    description: n8n 實例的主機名稱或 IP 位址。若使用 Cloudflare Tunnel，請設定為您的 Tunnel 網域名稱。
  N8N_PATH:
    name: URL 路徑
    description: n8n 部署的路徑（預設為 '/'）
  N8N_EDITOR_BASE_URL:
    name: 編輯器公開網址
    description: 透過 Cloudflare Tunnel 等反向代理開啟 n8n 編輯器時使用的完整 HTTPS 網址。
  N8N_WEBHOOK_URL:
    name: Webhook 公開網址
    description: 對外公告的 production 與 test webhook 完整 HTTPS 網址。n8n 2.35 之後優先使用此設定。
  WEBHOOK_URL:
    name: 舊版 Webhook 網址
    description: 相容 n8n 2.35 以前版本，啟動時會自動與 N8N_WEBHOOK_URL 同步。
  N8N_PROXY_HOPS:
    name: 反向代理層數
    description: n8n 前方可信任的反向代理層數。標準 Cloudflare Tunnel 架構請設為 1。
  N8N_SECURE_COOKIE:
    name: 安全 Cookie
    description: 區域網路 HTTP 存取預設停用。僅透過 HTTPS 存取 n8n 時，請啟用此選項。
  clean_redis:
    name: 清除 Redis 快取
    description: >-
      啟動時以全新的資料庫啟動 Redis。僅在遇到需要清除 Redis 的問題時使用。
network:
  5678/tcp: n8n 網頁介面、API、Webhook 與 WebSocket 來源
