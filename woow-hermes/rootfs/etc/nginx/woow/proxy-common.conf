# Shared by every proxied location of the ingress server.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Prefix $safe_ingress_path;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 1d;
proxy_send_timeout 1d;
# Separate the sidebar's Hermes session from the LAN port's (cookies.js).
proxy_set_header Cookie $ingress_cookie;
js_header_filter cookies.rename_set_cookie;
