# HA Ingress adapter for the Hermes dashboard. The LAN port 9119 is the raw
# upstream dashboard; this server only exists for the sidebar.
#
# Hermes supports path prefixes natively through X-Forwarded-Prefix: Location
# headers, cookie Path, window.__HERMES_BASE_PATH__, index.html asset URLs, CSS,
# router basename, REST and WebSocket URLs. So there is no proxy_redirect here
# (it would double-prefix). The sub_filters cover the places upstream misses,
# measured against v2026.8.31 / dashboard 0.21.0; the Dockerfile fails the build
# if any anchor disappears.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # No $args: WebSocket tickets travel in the query string.
    log_format woow '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout woow;

    js_import cookies from /etc/nginx/woow/cookies.js;
    js_set $ingress_cookie cookies.request_cookie;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Ingress WebSockets go through the relay, which records how Hermes closed
    # them: HA ingress hands the browser a clean 1000 whatever the real code.
    map $http_upgrade $api_upstream {
        default 127.0.0.1:9119;
        "~*^websocket$" 127.0.0.1:9121;
    }

    # The value is injected into HTML and JS below, so only a well-formed ingress
    # path is accepted.
    map $http_x_ingress_path $safe_ingress_path {
        default "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$" $http_x_ingress_path;
    }

    # Rewritten HTML/JS/CSS must not be cached: Hermes marks /assets immutable,
    # and a stale rewritten copy outlives an ingress token change.
    map $upstream_http_content_type $ingress_cache_control {
        default $upstream_http_cache_control;
        "~*^text/html[[:space:]]*(?:;|$)" no-store;
        "~*^(?:application|text)/(?:x-)?javascript[[:space:]]*(?:;|$)" no-store;
        "~*^text/css[[:space:]]*(?:;|$)" no-store;
    }

    server {
        listen 9120 default_server;
        allow 172.30.32.2;
        deny all;

        # Hermes enforces its own limits (100 MiB managed files).
        client_max_body_size 0;

        location = /__woow/ingress-shim.js {
            alias /etc/nginx/woow/ingress-shim.js;
            default_type application/javascript;
            add_header Cache-Control no-store always;
        }

        # REST, WebSockets and file transfer: passed through byte for byte, so
        # user files served from here are identical to the LAN port.
        location ^~ /api/ {
            proxy_pass http://$api_upstream;
            include /etc/nginx/woow/proxy-common.conf;
        }

        location = /__woow/wsclose {
            proxy_pass http://127.0.0.1:9121;
            include /etc/nginx/woow/proxy-common.conf;
            add_header Cache-Control no-store always;
        }

        location / {
            proxy_pass http://127.0.0.1:9119;
            # proxy_set_header does not inherit into a location that sets its own,
            # so every location includes the full set.
            include /etc/nginx/woow/proxy-common.conf;
            proxy_set_header Accept-Encoding "";
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control $ingress_cache_control always;

            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;

            # /login is server-rendered and not prefix-aware (dashboard_auth/login_page.py).
            sub_filter "fetch('/auth/password-login'" "fetch('$safe_ingress_path/auth/password-login'";
            sub_filter "window.location.assign((data && data.next) || '/')" "window.location.assign('$safe_ingress_path' + ((data && data.next) || '/'))";
            sub_filter "url('/fonts/" "url('$safe_ingress_path/fonts/";
            sub_filter 'href="/auth/login?' 'href="$safe_ingress_path/auth/login?';
            # Vite's modulepreload helper builds root-absolute chunk URLs; a failed
            # preload leaves /chat (no terminal) and /system blank.
            sub_filter 'function(e){return`/`+e}' 'function(e){return(window.__HERMES_BASE_PATH__||``)+`/`+e}';
            # Hard-coded full-page navigations in the SPA.
            sub_filter 'window.location.assign(`/login`)' 'window.location.assign((window.__HERMES_BASE_PATH__||``)+`/login`)';
            sub_filter 'href:`/config`' 'href:(window.__HERMES_BASE_PATH__||``)+`/config`';
            # FastAPI's Swagger page at /docs.
            sub_filter "url: '/openapi.json'" "url: '$safe_ingress_path/openapi.json'";
            # The server-rendered /login page has no icon link, so the browser would
            # ask HA's root for /favicon.ico.
            sub_filter '</head>' '<link rel="icon" href="$safe_ingress_path/favicon.ico"><script src="$safe_ingress_path/__woow/ingress-shim.js"></script></head>';
        }
    }
}
