worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache-control: same as the sibling n8n addon — HTML/JS/CSS always
    # revalidated so the React SPA doesn't serve a stale bundle after an
    # addon upgrade under the same ingress path.
    #
    # CRITICAL: omnigent-server sends `content-type: text/javascript` (the
    # older spelling, not `application/javascript`) AND `cache-control:
    # public, max-age=31536000, immutable` on all bundle files. The
    # combination froze the browser onto pre-sed-patch bundles for a full
    # year and hid our HA-ingress fixes for hours. Match both spellings
    # here, AND `proxy_hide_header Cache-Control` in the location block
    # so our `add_header` actually replaces the upstream one rather than
    # stacking with it.
    map $sent_http_content_type $ingress_cache_control {
        default                    "";
        ~*text/html                "no-store";
        ~*(application|text)/(?:x-)?javascript "no-store";
        ~*text/css                 "no-store";
    }

    # HA Supervisor gives every addon a stable ingress path like
    # /api/hassio_ingress/<16-128 char slug>. Sanitise + capture into a
    # variable that sub_filter uses to rewrite absolute asset URLs.
    map $http_x_ingress_path $safe_ingress_path {
        default                                                  "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$"           $http_x_ingress_path;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Supervisor-only. Ingress traffic always comes from 172.30.32.2.
        allow 172.30.32.2;
        deny  all;

        # Also expose /health to the supervisor watchdog on the same port
        # so the addon's `watchdog:` URL Just Works.
        location = /health {
            allow all;
            proxy_pass http://127.0.0.1:8000/health;
        }

        # NOTE: no `location = / { return 302 ... }` here. Supervisor
        # strips `/api/hassio_ingress/<slug>` before proxying, so the
        # browser hitting `.../<slug>/` reaches us as `GET /` and we
        # must let that pass through to omnigent-server. Redirecting
        # to `$safe_ingress_path/` creates a loop
        # (ERR_TOO_MANY_REDIRECTS) because the browser then re-hits
        # the same URL.

        # Version-prefixed asset alias — nginx substitutes
        # `/assets/` → `/assets-v0-1-20/` in the HTML so browsers can't
        # reuse pre-patch cached bundles under the old immutable URL.
        # Strip the version and forward to omnigent's real /assets/.
        location ~ ^/assets-v0-1-20/(.*)$ {
            proxy_pass http://127.0.0.1:8000/assets/$1;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;
            proxy_set_header Accept-Encoding   "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;

            # Same sub_filter rules as the parent location — chunk imports
            # inside JS bundles still point at `/assets/...` and need
            # rewriting to `/assets-v0-1-20/...` so no browser-cache hit.
            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter '"/assets/'   '"$safe_ingress_path/assets-v0-1-20/';
            sub_filter '\'/assets/'  '\'$safe_ingress_path/assets-v0-1-20/';
            sub_filter '`/assets/'   '`$safe_ingress_path/assets-v0-1-20/';
            # Vite manifest preload uses basePath+"assets/foo.js" strings
            # (no leading slash) that resolve to origin at runtime. Same
            # rewrite as in parent location.
            sub_filter '"assets/'    '"assets-v0-1-20/';
            sub_filter "'assets/"    "'assets-v0-1-20/";
        }

        # Everything else — React SPA + FastAPI backend + SSE stream +
        # runner WebSocket tunnel.
        location / {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;

            # sub_filter can't rewrite gzip'd response bodies, so tell
            # upstream not to compress. FastAPI/uvicorn respects an
            # empty Accept-Encoding by returning identity.
            proxy_set_header Accept-Encoding   "";

            # NOTE: `proxy_redirect` rules were tried to prefix Location
            # headers, but they caused ERR_TOO_MANY_REDIRECTS. When
            # HA Supervisor forwards a redirect, nginx expands the
            # replacement into a full URL using the request Host, which
            # ends up as `http://<host>:8080/…` — that then loops back
            # through CF's HTTPS upgrade. Leaving proxy_redirect at the
            # default `default` — upstream's 200 OK responses don't
            # need Location rewriting anyway.

            # WebSocket upgrade for /v1/runners/*/tunnel and /v1/sessions/*/stream (SSE).
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Strip upstream's immutable/max-age header before we add ours,
            # otherwise the browser sees BOTH and honours the more
            # permissive one → cache poisoning after any code change.
            proxy_hide_header Cache-Control;
            add_header Cache-Control $ingress_cache_control always;

            # Inject Omnigent's native base path (0.15+) before its JS loads.
            # Supervisor strips the prefix before proxying to this nginx;
            # the browser needs it for API, WebSocket and navigation URLs.
            # Rewrite root-absolute assets as the build still emits them.
            sub_filter_types text/html application/javascript;
            sub_filter_once off;
            sub_filter '<head>' '<head><base href="$safe_ingress_path/"><script>window.__OMNIGENT_BASE_PATH__="$safe_ingress_path";</script>';
            # Use a versioned asset alias to avoid stale cached bundles.
            # Catch every quoting style used to reference /assets/ paths
            # across HTML tags AND JS bundles (`new URL(...)`, template
            # literals for lazy chunks, dynamic import specifiers, CSS
            # preload etc.). Missing any of these makes lazy routes like
            # Settings > Members / Policies / Sharing black-screen
            # because their code-split CSS/JS 404s from HA origin.
            sub_filter 'src="/assets/'  'src="$safe_ingress_path/assets-v0-1-20/';
            sub_filter 'href="/assets/' 'href="$safe_ingress_path/assets-v0-1-20/';
            sub_filter 'from"/assets/'  'from"$safe_ingress_path/assets-v0-1-20/';
            sub_filter 'from "/assets/' 'from "$safe_ingress_path/assets-v0-1-20/';
            sub_filter '"/assets/'      '"$safe_ingress_path/assets-v0-1-20/';
            sub_filter "'/assets/"      "'$safe_ingress_path/assets-v0-1-20/";
            sub_filter '`/assets/'      '`$safe_ingress_path/assets-v0-1-20/';
            # Vite modulepreload manifest concatenates `basePath + "assets/foo.js"`
            # with basePath = "/", producing runtime URLs `/assets/foo.js` that
            # browser fetches without our prefix. Rewrite the leading-slash-
            # less form in-flight too.
            sub_filter '"assets/'       '"assets-v0-1-20/';
            sub_filter "'assets/"       "'assets-v0-1-20/";

        }
    }
}
