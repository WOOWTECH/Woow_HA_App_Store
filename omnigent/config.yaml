name: Woow Omnigent
version: 0.1.22
slug: woow-omnigent
image: ghcr.io/woowtech/woow-ha-omnigent-{arch}
description: >-
  Omnigent 0.21.0 meta-harness — orchestration server + bundled Postgres.
  External runners (pi / claude / codex / …) register from wherever via
  `omnigent host --server http://homeassistant.local:8000`. HTTP for LAN;
  pair with the Cloudflared add-on for HTTPS.
url: https://github.com/WOOWTECH/Woow_ha_omnigent_addon
arch: [amd64, aarch64]
init: false
# init-addon-config saves a generated admin_password through the Supervisor
# API (POST /addons/self/options) on a new install, so hassio_api must be true.
hassio_api: true
homeassistant_api: false
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:brain
panel_title: Omnigent
panel_admin: true
# NOTE: `ingress_entry: login` was tried but interacts badly with
# `proxy_redirect` in nginx — HA Supervisor keeps redirecting the root
# path to the entry, our nginx re-prefixes, and the browser hits
# ERR_TOO_MANY_REDIRECTS. Leave unset — Supervisor opens at root.
webui: "http://[HOST]:[PORT:8000]"
watchdog: "http://[HOST]:[PORT:8080]/health"
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: >-
    Web UI + runner tunnel endpoint (LAN). Bind to a public-reachable URL
    via the Cloudflared HA add-on if remote runners need to dial in.
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
  - type: backup
    read_only: false
backup: cold
backup_exclude:
  - "**/logs/**"
schema:
  # --- Admin identity ------------------------------------------------------
  admin_username: str
  # Deliberately without a default. Empty on a new install: the first start
  # generates a random password and saves it here through the Supervisor API
  # (stops instead if it cannot save it). An install that already has its
  # database keeps running with an empty value and nothing is generated,
  # because the account exists and the option is read only when the account
  # is created. Releases up to 0.1.15 pre-filled a default that was readable
  # in this repository.
  admin_password: password
  # --- Public URL runners dial in on ---------------------------------------
  # Only set this if you have a Cloudflared add-on route pointing at us —
  # runners registered via that URL use it in webhook links and invite URLs.
  # Leave empty to use http://homeassistant.local:8000 (LAN default).
  base_url: str?
  # --- Feature flags forwarded via OMNIGENT_FEATURES= ---------------------
  # 以逗號分隔。預設 "usage_page,harness_install"，不是
  # omnigent 認得的全部 feature。omnigent 0.21.0 另外預設開啟
  # session_orchestration、claude_osc_status、codex_plan_at_launch，不必列出，
  # 要關閉寫 -<name>。不認得的名稱會讓 server 拒絕啟動。
  features: str?
  # --- Extra env vars (arbitrary passthrough) ------------------------------
  env_vars:
    - key: match(^[A-Z][A-Z0-9_]*$)
      value: str
options:
  admin_username: woow
  admin_password: ""
  base_url: ""
  features: "usage_page,harness_install"
  env_vars: []
# No `services:` — Postgres is bundled inside the container via s6 (same
# pattern as Woow_ha_n8n's bundled redis). External runners register over
# HTTP, so no MariaDB or other Supervisor service dependency is needed.
