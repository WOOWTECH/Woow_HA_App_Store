daemon off;
pid /var/run/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;

    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # HA Supervisor talks WebSocket for chat streaming — allow long-lived upstream connections.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Allow file uploads up to pi-web application-layer total limit (100 MB).
    # Without this, nginx defaults to 1 MB and returns 413 on image uploads
    # from tablet/browser through HAOS ingress. Matches the 100 MB total /
    # 25 MB per-file caps enforced in /api/files/[...path]/route.ts.
    client_max_body_size 100M;

    # Body-rewrite settings. sub_filter can't inspect compressed bodies, so we
    # tell pi-web (upstream) to never gzip; the browser still gets whatever
    # HA Supervisor's ingress layer chooses to compress.
    sub_filter_once off;
    sub_filter_last_modified on;
    sub_filter_types text/html text/css application/javascript application/x-javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Whitelist-validate the X-Ingress-Path header before we ever inject it
    # into HTML / JS bodies via sub_filter. The header is supposed to come from
    # HA Supervisor and always look like /api/hassio_ingress/<opaque-token>.
    # If it doesn't match, force to "" so any body-rewrite becomes a no-op —
    # this closes the "; alert(1); //-style XSS vector should a misconfigured
    # upstream proxy ever let the client control the header.
    map $http_x_ingress_path $safe_ingress_path {
        default                                     "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$" $http_x_ingress_path;
    }

    server {
        listen 30142 default_server;

        # Home Assistant Supervisor injects X-Ingress-Path with the current
        # ingress prefix (e.g. /api/hassio_ingress/<token>). We prepend it to
        # every absolute path pi-web emits so browser requests round-trip
        # back through the Supervisor's ingress proxy.
        location / {
            proxy_pass http://127.0.0.1:30141;
            proxy_http_version 1.1;
            # pi-web's isApiRequestAllowed() rejects any Host header that is
            # not a loopback name (localhost / *.localhost) or a raw IP, and
            # rejects any Origin that doesn't exactly match protocol://host.
            # Under HA Ingress the browser hits homeassistant.local:8123, so
            # forwarding $host / $http_origin would trip the guard and every
            # auth-gated route (skills, plugins, models, project-trust,
            # file-index, ...) would 403 "Untrusted API request". Rewriting
            # Host to "localhost" and stripping Origin makes the check pass
            # without requiring users to configure extra_allowed_hosts.
            proxy_set_header Host localhost;
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $safe_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Force uncompressed upstream so sub_filter can rewrite the body.
            proxy_set_header Accept-Encoding "";

            # HTML — absolute path attributes.
            sub_filter 'href="/_next/'    'href="$safe_ingress_path/_next/';
            sub_filter 'src="/_next/'     'src="$safe_ingress_path/_next/';
            sub_filter 'href="/favicon'   'href="$safe_ingress_path/favicon';
            # pi-web 0.8.4 emits static PWA <link> tags in SSR HTML that
            # skip Next.js's asset-prefix pass. Rewrite at byte level so
            # the browser parses correct hrefs — the client shim can't
            # touch <link> tags already in the initial HTML.
            sub_filter 'href="/manifest'  'href="$safe_ingress_path/manifest';
            sub_filter 'href="/icons/'    'href="$safe_ingress_path/icons/';

            # RSC flight payloads (JSON-escaped inside script tags).
            sub_filter '\"/_next/'        '\"$safe_ingress_path/_next/';
            sub_filter '\"/favicon'       '\"$safe_ingress_path/favicon';

            # CSS — url(/_next/...) references for fonts / media.
            sub_filter 'url(/_next/'      'url($safe_ingress_path/_next/';

            # Webpack chunk loader constants inside JS.
            sub_filter '"/_next/'         '"$safe_ingress_path/_next/';

            # pi-web's client-side JS calls /api/* on absolute paths (fetch,
            # EventSource, XHR — over 40 distinct routes: /api/sessions,
            # /api/skills, /api/agent/*, /api/auth/*, /api/files/*, /api/git/*,
            # /api/plugins, /api/models*, /api/worktrees, ...). Rewriting them
            # via sub_filter is unsafe (the bundle already contains one
            # /api/hassio_ingress/... literal that must NOT be double-prefixed).
            # Instead inject a shim at </head> that monkey-patches fetch /
            # EventSource / XMLHttpRequest to prepend the ingress prefix. Also
            # catches Next.js RSC prefetch fetches (they carry ?_rsc=<token>
            # on the current path — root becomes /?_rsc=… which otherwise
            # bypasses the /api/* filter and lands on HA Core), and wraps
            # history.pushState/replaceState so router.push('/') keeps the
            # iframe inside the ingress prefix instead of navigating out to
            # the HA dashboard.
            sub_filter '</head>' '<script>window.__INGRESS_PATH__="$safe_ingress_path";(function(){var P=window.__INGRESS_PATH__||"";if(!P)return;var S=function(u){if(typeof u!=="string")return u;if(u.indexOf(location.origin)===0)return u.slice(location.origin.length);return u};var T=function(u){if(typeof u!=="string")return false;var p=S(u);if(typeof p!=="string"||p.charAt(0)!=="/")return false;if(p.indexOf("/api/hassio_ingress/")===0)return false;if(p.indexOf("/api/")===0)return true;if(p.indexOf("/_next/")===0)return true;if(p.indexOf("/favicon")===0)return true;if(p.indexOf("/manifest")===0)return true;if(p.indexOf("/icons/")===0)return true;if(p.indexOf("_rsc=")!==-1)return true;return false};var F=window.fetch;window.fetch=function(i,o){if(typeof i==="string"){var p=S(i);if(T(p))i=P+p}else if(i instanceof URL){var p=S(i.href);if(T(p))i=P+p}else if(i&&i.url){var u=S(i.url);if(T(u))i=new Request(P+u,i)}return F(i,o)};var E=window.EventSource;if(E){var NE=function(u,o){var p=S(u);if(T(p))u=P+p;return new E(u,o)};NE.prototype=E.prototype;NE.CONNECTING=0;NE.OPEN=1;NE.CLOSED=2;window.EventSource=NE}var X=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){var p=S(u);if(T(p))arguments[1]=P+p;return X.apply(this,arguments)};var mH=function(o){return function(s,t,u){if(typeof u==="string"){var p=S(u);if(typeof p==="string"&&p.charAt(0)==="/"&&p.indexOf(P)!==0&&p.indexOf("/api/hassio_ingress/")!==0)arguments[2]=P+p}return o.apply(this,arguments)}};history.pushState=mH(history.pushState);history.replaceState=mH(history.replaceState);var R=function(v){if(typeof v!=="string")return v;var p=S(v);return T(p)?P+p:v};var oSA=Element.prototype.setAttribute;Element.prototype.setAttribute=function(n,v){if((n==="href"||n==="src")&&typeof v==="string")v=R(v);return oSA.call(this,n,v)};var pA=function(proto,attr){if(!proto)return;var d=Object.getOwnPropertyDescriptor(proto,attr);if(!d||!d.set)return;Object.defineProperty(proto,attr,{get:d.get,set:function(v){return d.set.call(this,R(v))},configurable:true})};pA(window.HTMLLinkElement&&HTMLLinkElement.prototype,"href");pA(window.HTMLScriptElement&&HTMLScriptElement.prototype,"src");pA(window.HTMLImageElement&&HTMLImageElement.prototype,"src");try{if(navigator&&navigator.serviceWorker&&navigator.serviceWorker.register){navigator.serviceWorker.register=function(){return Promise.resolve({scope:"/",installing:null,waiting:null,active:null,update:function(){return Promise.resolve()},unregister:function(){return Promise.resolve(true)},addEventListener:function(){},removeEventListener:function(){}})}}}catch(e){}})();</script></head>';
        }
    }
}
