---
configuration:
  server_url:
    name: 伺服器 URL
    description: >-
      Tailscale client 用來連進來的公開網址（例如 LAN 內測試用
      http://homeassistant.local:28080，外部曝露用
      https://headscale.example.com）。**這裡的網域必須跟「MagicDNS 尾綴」
      不同**，否則 Headscale 拒啟動。
  log_level:
    name: Log 等級
    description: Headscale log 的詳細程度。
  ipv4_prefix:
    name: IPv4 網段
    description: 配給 tailnet 節點的 IPv4 範圍，須為 100.64.0.0/10 的子網。
  ipv6_prefix:
    name: IPv6 網段
    description: 配給 tailnet 節點的 IPv6 範圍，須為 fd7a:115c:a1e0::/48 的子網。
  magic_dns_base_domain:
    name: MagicDNS 尾綴
    description: >-
      節點主機名後綴（例如 `phone.ts.local`）。**必須與伺服器 URL 的網域不同**。
  create_default_user:
    name: 首次啟動建立 default 使用者
    description: >-
      啟用時，add-on 首次啟動會自動建立 `default` 使用者（idempotent，開著沒副作用）。
  ngrok_enabled:
    name: 啟用 ngrok 對外入口
    description: >-
      將 Headscale 控制入口透過 ngrok 公開；產生的網址會自動設定為 server_url。
      需要填寫 ngrok authtoken。Headplane 管理介面仍只透過 HA Ingress 開啟。
  ngrok_authtoken:
    name: ngrok authtoken
    description: ngrok 平台提供的 authtoken；啟用 ngrok 時必填。
  ngrok_mode:
    name: ngrok 模式
    description: >-
      http 會提供 HTTPS 控制入口；tcp 是測試用原始通道，外部客戶端需使用
      http:// 控制網址。
  ngrok_domain:
    name: ngrok 固定網域
    description: >-
      選填。填入已保留的 ngrok 網域可避免重啟後網址變更；留空時免費方案
      可能在重啟後換網址，需重新確認客戶端的控制網址。
