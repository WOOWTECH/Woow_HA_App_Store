# Upgrade comparison for a WOOW source repository (pipeline #89, ADR-0005).
#
# A merged version-bump PR is a release, so every PR compares each add-on whose
# version it changes with the version users run now: the latest stable Release
# (tag v<ver>, or <slug>-v<ver> when a repository versions add-ons
# independently); for ref_policy: main repositories, the commit on the PR base
# where its current version first appeared (#129), so a breaking change merged
# in a PR that changed no version is still compared when the next PR bumps it.
# The PR's version must be newer: every Release becomes the latest, so a lower
# one would be a downgrade. Breaking
# configuration changes must be declared in <addon>/upgrade-notes.yaml
# (change names: the docstring of .addon-sync/upgrade_check.py; file format: .addon-sync/addon_sync.py).
# A PR that changes no version passes in seconds; any tool error fails.
#
# Category 4 (add-ons with a prebuilt image): the caller's amd64 build hands
# over its SBOM through the Store action .github/actions/addon-sbom; this
# workflow pulls the comparison target's amd64 image from GHCR, makes its
# SBOM with the same pinned Syft, updates the Grype DB once (it fails when the
# DB is more than DB_MAX_AGE_HOURS old) and scans both SBOMs with that DB.
# The caller does not make this job wait on the build: only after it finds a
# version change does it wait (at most sbom_wait_minutes) for the SBOM artifact
# of the same run attempt, through the Actions API (a re-run judges its own
# build, so re-run all jobs). An add-on with a prebuilt image whose SBOM
# never arrives fails the check; it is never skipped.
# Add-ons built on the device (#146; either side, as each side's config says)
# get category 4 from the images the runtime job rebuilds for the upgrade test
# (below): it makes their SBOMs with the same pinned Syft and syft.yaml right
# after each build and hands them over as the artifact
# upgrade-comparison-rebuilt-sboms-attempt-<N>; compare scans them with the
# same DB. A rebuilt side without its SBOM (the rebuild or Syft failed, or the
# artifact is missing) fails category 4 with the reason. A provider
# whose shipped image is the published one its config.yaml names, not one the
# caller's PR builds (knxd ships a third-party image, #147; mcp_addons builds
# its images only on woow-disposable-builder, #148), has
# upgrade_comparison.scan_published_image in the Store registry (the approved
# reason and ticket): both sides are then that image's amd64 tag <version>,
# pulled like the comparison target's, and no SBOM artifact is awaited; a PR
# whose version's image is not published yet fails. A caller whose category 4
# cannot run passes skip_vulnerability_scan (any non-empty text, e.g. the
# reason): category 4 is then skipped for every add-on in the call; the
# configuration comparison still runs. Only a provider whose Store registry
# entry has upgrade_comparison.skip_vulnerability_scan (the approved reason
# and ticket; no provider has one now) may pass it, and the report gives that
# approved reason, not the caller's text; any other caller that passes it
# fails.
#
# Category 2, the upgrade test (#137 startup, #138 data checks), runs in the
# runtime job for add-ons with a prebuilt image when the caller passes
# image_artifact: the caller's amd64 build hands over the new image through the
# Store action .github/actions/addon-image (docker save; nothing is pushed to
# GHCR or rebuilt), the comparison target's image is pulled from GHCR, and
# .addon-sync/upgrade_runtime.py starts both, one after the other, on the same
# data directories under a mock Supervisor. The add-on's upgrade-check/ (in the
# PR) may hold the hooks seed (run on the comparison target) and verify (run on
# the new version); the repository never runs docker itself (hook interface:
# upgrade_runtime.py's docstring). Without verify the data is not checked and
# the summary says so. compare needs runtime, lists each add-on's report with
# every check, and fails, with the reason, when the upgrade test fails. A comparison
# target that cannot be tested (its image cannot be pulled, it does not start,
# its seed fails) fails it too (#140), unless the add-on's Store registry entry
# has upgrade_comparison.skip_upgrade_test (the approved reason and ticket):
# then categories 2 and 3 are skipped and the report gives that reason (the
# add-on is not started; one built on the device is still rebuilt, only for
# its category 4 SBOMs, #146). The
# registry alone decides; there is no caller input. Callers that pass no
# image_artifact are reported as not run yet (rolled out in #143). A provider
# with upgrade_comparison.scan_published_image (category 4 above; knxd, #154)
# needs no image_artifact: its new image is the published one the PR's config
# names (image's amd64 tag <version>), pulled like the comparison target's,
# and a PR whose version's image is not published yet fails as the PR's fault
# (the same message as category 4). Add-ons built
# on the device (#144) have no image to pull or hand over, so the runtime job
# builds both for amd64 as Supervisor does (upgrade_check.py build-args): the
# new one from the PR checkout, the comparison target's from its source at the
# target (its Release tag, or for ref_policy main the commit on the PR base
# where its version first appeared); they need no image_artifact. A target that
# cannot be downloaded or rebuilt is a comparison-target failure, as a pull is.
#
# Category 3, the regression comparison (#139), runs in the same upgrade test
# (upgrade_runtime.py, in the runtime job): upgrade-check/smoke (optional) runs
# on the comparison target and on the new version, and its checks are compared
# by name with the rule upgrade_check.regression(): a check that passes on the
# comparison target and not on the new version, or one only the new version
# has that does not pass, fails the upgrade test; one that does not pass on the
# comparison target is only reported. Without smoke, only startup is compared.
# The report lists every check on both versions.
#
# Caller (in a workflow that also runs on push to the default branch, so
# addon_sync's ci_gate keeps seeing a successful non-PR run; no path filter,
# no needs: on the build):
#
#   upgrade-comparison:
#     name: Upgrade comparison
#     permissions:
#       contents: read
#       actions: read                             # find and download this run's SBOM and image artifacts
#     uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
#     with:
#       sbom_artifact: upgrade-comparison-sbom-*  # omit only when no add-on has a prebuilt image, or with scan_published_image
#       image_artifact: upgrade-comparison-image-*  # the upgrade test; omit until the repository is rolled out (#143), when every add-on is built on the device, and with scan_published_image
#       # skip_vulnerability_scan: "<reason>"      # instead of sbom_artifact, only when category 4 does not apply (quote it)
#
# GitHub names the check "<caller job> / <job>": "Upgrade comparison / compare".
# On other events both jobs pass at once: the PR was already compared.
name: Upgrade comparison
'on':
  workflow_call:
    inputs:
      tooling_ref:
        description: Store ref whose .addon-sync tooling runs; keep it equal to the ref in the uses line.
        type: string
        default: main
      sbom_artifact:
        description: Name or glob of the artifacts the addon-sbom action uploads in the same run (upgrade-comparison-sbom-<component>-attempt-<run attempt>; pass upgrade-comparison-sbom-*); required when an add-on has a prebuilt image.
        type: string
        default: ''
      skip_vulnerability_scan:
        description: Non-empty (e.g. the reason) skips the vulnerability comparison (category 4) for every add-on in this call; only for providers the Store registry approves, and the report gives the registry's approved reason. Empty scans as usual.
        type: string
        default: ''
      sbom_wait_minutes:
        description: How long a version-change PR waits for the SBOM artifacts of the same run before it fails.
        type: number
        default: 40
      image_artifact:
        description: Name or glob of the artifacts the addon-image action uploads in the same run (upgrade-comparison-image-<component>-attempt-<run attempt>; pass upgrade-comparison-image-*); empty = the upgrade test of add-ons with a prebuilt image is not run yet (#143). Add-ons built on the device need none (#144), nor providers the Store registry approves with scan_published_image, whose new image is pulled (#154).
        type: string
        default: ''
      image_wait_minutes:
        description: How long a version-change PR waits for the new-image artifacts of the same run before it fails.
        type: number
        default: 40
permissions:
  contents: read
  actions: read
jobs:
  # The required check. It waits for runtime (categories 2 and 3) and runs whatever runtime's result:
  # a skipped required check counts as passed, so it must never be skipped.
  compare:
    name: compare
    needs: runtime
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Grype refuses an older DB; the step after `grype db update` checks it too, with a clear reason.
      DB_MAX_AGE_HOURS: '120'
    steps:
    # These steps up to the plan also run in the runtime job (YAML aliases), so both jobs judge the same add-ons and targets.
    - &not-pr
      name: Not a pull request
      if: github.event_name != 'pull_request'
      env:
        EVENT: ${{ github.event_name }}
      run: echo "Upgrade comparison runs on pull requests; nothing to compare on ${EVENT} (the PR was already compared)." >> "$GITHUB_STEP_SUMMARY"
    - &checkout-pr
      name: Check out the pull request
      if: github.event_name == 'pull_request'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        persist-credentials: false
    - &checkout-tooling
      name: Check out Store tooling
      if: github.event_name == 'pull_request'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: WOOWTECH/Woow_HA_App_Store
        ref: ${{ inputs.tooling_ref }}
        path: tooling
        sparse-checkout: |
          .addon-sync
          .github/workflows
          .github/actions/addon-sbom
        persist-credentials: false
    - &install
      name: Install dependencies
      if: github.event_name == 'pull_request'
      run: python3 -m pip install -r tooling/.addon-sync/requirements.txt
    - &detect
      name: Find add-ons whose version changed
      id: detect
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SKIP_VULNERABILITY_SCAN: ${{ inputs.skip_vulnerability_scan }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/gh_raw.sh
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        # The registry entry and each add-on's file paths, by addon_sync's rules; the later steps read provider.json too.
        provider="$(python3 tooling/.addon-sync/upgrade_check.py components --registry tooling/.addon-sync/registry.json --repo "${REPO}")" \
          || fail_output "${provider}"
        printf '%s\n' "${provider}" > provider.json
        # Skipping category 4 is approved per provider in the Store registry, with the reason; checked on every PR.
        if [ -n "${SKIP_VULNERABILITY_SCAN}" ] && [ -z "$(jq -r '.skip_vulnerability_scan' provider.json)" ]; then
          fail "${REPO} passes skip_vulnerability_scan, but skipping the vulnerability comparison is not approved for it: the Store registry entry needs upgrade_comparison.skip_vulnerability_scan with the reason. Remove the input or get the skip approved in the registry."
          exit 1
        fi
        : > changed.jsonl; status=0
        echo "## Upgrade comparison" >> "$GITHUB_STEP_SUMMARY"
        # Same detection as Woow_ha_odoo's CI: the version in the PR against the version on the PR base.
        while IFS= read -r component; do
          fields "${component}" id=id path=config notes=notes previous=previous_config previous_notes=previous_notes
          # During a config move (previous_config in the registry) either side may still have the config at the old path.
          base="$RUNNER_TEMP/${id}.base.yaml"; new="$RUNNER_TEMP/${id}.new.yaml"
          config_at "${BASE_SHA}" "${path}" "${previous}" "${base}" > /dev/null
          found="$(config_at "" "${path}" "${previous}" "${new}")"
          if [ -z "${found}" ]; then
            # A config the PR deletes or moves, or a registry path that is wrong, must not pass as "nothing to compare".
            if [ -s "${base}" ]; then
              fail "${id}: this PR deletes or moves ${path}, the config the Store registry lists for this add-on; restore it, or to move it, first merge a Store PR that lists the new path with previous_config: ${path}, then re-run this check (moving a config, Store README)"
            else
              fail "${id}: the Store registry lists ${path}${previous:+ (or previous_config ${previous})} for this add-on, but neither this PR nor its base has it; correct the registry entry, or for a new add-on, add it to the registry only after its config is merged here (Store README)"
            fi
            status=1; continue
          fi
          # Its upgrade-notes.yaml is next to the config it has.
          [ "${found}" = "${path}" ] || notes="${previous_notes}"
          # A version is read as Home Assistant Supervisor reads it (addon_sync.config_version); the PR's also as written.
          current="$(python3 tooling/.addon-sync/upgrade_check.py version --file "${new}" --path "${found}" --name "${id}" --as-written)" \
            || fail_output "${current}"
          if [ -z "${current}" ]; then fail "${id}: ${found} has no version"; status=1; continue; fi
          # Besides esc on every echo: a value from the PR or its Releases with a control character is refused before use.
          no_cntrl "${current}" "${id}: the version in ${found} contains a control character (newline, tab...): ${current}" || exit 1
          before=""; [ ! -s "${base}" ] || before="$(python3 tooling/.addon-sync/upgrade_check.py version --file "${base}" --name "${id}")" \
            || fail_output "${before}"
          if [ "${current}" != "${before}" ]; then
            jq -c --arg version "${current}" --arg notes "${notes}" --arg new "${new}" '. + {version: $version, notes: $notes, new: $new}' <<<"${component}" >> changed.jsonl
          else
            echo "- ${id}: version ${current} unchanged" >> "$GITHUB_STEP_SUMMARY"
          fi
        done < <(jq -c '.components[]' provider.json)
        if [ -s changed.jsonl ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else
          echo "No add-on version changed; nothing to compare." >> "$GITHUB_STEP_SUMMARY"; echo "changed=false" >> "$GITHUB_OUTPUT"; fi
        exit "${status}"
    - &plan
      name: Find the comparison targets
      id: plan
      if: steps.detect.outputs.changed == 'true'
      env:
        SBOM_ARTIFACT: ${{ inputs.sbom_artifact }}
        SKIP_VULNERABILITY_SCAN: ${{ inputs.skip_vulnerability_scan }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/gh_raw.sh
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        source tooling/.addon-sync/images.sh
        policy="$(jq -r '.ref_policy' provider.json)"; approved="$(jq -r '.skip_vulnerability_scan' provider.json)"
        scan_published="$(jq -r '.scan_published_image' provider.json)"
        releases="$(gh api --paginate "repos/${REPO}/releases?per_page=100" --jq '.[]' | jq -sc .)"
        # plan.jsonl, one object per add-on: id, notes (path in the PR), new (where the detect step left the PR's config),
        # target, ref (old image to pull; "" = not pulled), new_ref (with scan_published_image the new image to pull; "" = the
        # caller's build hands over its SBOM, or it is rebuilt), artifact (the addon-sbom artifact of its new image),
        # rebuilt_old/rebuilt_new (#146: that side is built on the device; the runtime job rebuilds it and hands over its
        # SBOM), note (why there is no scan; "" = scanned).
        : > plan.jsonl; status=0
        while IFS= read -r component; do
          fields "${component}" id=id path=config previous=previous_config notes=notes version=version new=new
          old="$RUNNER_TEMP/${id}.old.yaml"; rm -f "$old"; touch "$old"; target=""; target_version=""; ref=""; note=""
          if [ "${policy}" = "main" ]; then
            # ref_policy main: the Store follows the default branch, so users run the PR base's version; the target is the
            # commit where that version first appeared, so a same-version change merged since (a PR with no bump) is compared too.
            target="$(version_since "${BASE_SHA}" "${path}" "${previous}" "${id}")" || fail_output "${target}"
          else
            # Stable-Release filter, tag rule, ordering and "the version must be newer" are the Release notes' (addon_sync).
            latest="$(python3 tooling/.addon-sync/upgrade_check.py comparison-target --registry tooling/.addon-sync/registry.json --repo "${REPO}" --component "${id}" --version "${version}" <<<"${releases}")" \
              || fail_output "${latest}"
            IFS=$'\t' read -r target target_version <<<"${latest}"
          fi
          # Like the PR's version (detect step): refused with a control character before use.
          no_cntrl "${target}${target_version}" "${id}: the comparison target's tag has a control character (newline, tab...): ${target}" || exit 1
          if [ -n "${target}" ]; then
            found="$(config_at "${target}" "${path}" "${previous}" "${old}")"
            old_version=""; [ ! -s "$old" ] || old_version="$(python3 tooling/.addon-sync/upgrade_check.py version --file "${old}" --path "${found}" --name "${id}")" \
              || fail_output "${old_version}"
            no_cntrl "${old_version}" "${id}: the comparison target ${target} has a control character (newline, tab...) in its version: ${old_version}" || exit 1
            # Its tag and its config both give the target's version (compare reads the config's); neither may silently win.
            # The PR's version must be newer than it: under ref_policy main too, so it fails here, before any scan.
            if [ -s "$old" ] && ! python3 tooling/.addon-sync/upgrade_check.py check-target --name="${id}" --version="${version}" \
              --target="${target}" --tag-version="${target_version}" --config="${found}" --config-version="${old_version}"; then
              status=1; continue
            fi
            if [ -s "$old" ]; then
              where=""; [ "${policy}" != "main" ] || where=", where version $(esc "${old_version}") first appeared on the PR base"
              echo "${id}: comparing $(esc "${version}") with $(esc "${target}")${where}"
            elif [ "${policy}" = "main" ]; then echo "${id}: no config at the PR base, a new add-on"
            else
              # Users run this Release; an unreadable config there must not pass as "no comparison target".
              fail "${id}: the comparison target ${target} has no ${path}${previous:+ or ${previous}}, so there is nothing to compare with; if the config moved, see moving a config in the Store README"
              status=1; continue
            fi
          else
            echo "${id}: no stable Release yet"
          fi
          # Category 4: needs a comparison target; then both images' SBOMs are mandatory, each side from where its image is
          # (#146): an image built on the device (no image in that side's config) from the runtime job, which rebuilds it
          # for the upgrade test anyway; the comparison target's prebuilt image pulled from GHCR; the PR's prebuilt image
          # from the caller's build or, when the registry approves scan_published_image, the image the PR's config names.
          image="$(yq -r '.image // ""' "${new}")"; new_ref=""; rebuilt_old=false; rebuilt_new=false
          artifact="upgrade-comparison-sbom-${id}-attempt-${RUN_ATTEMPT}"
          if [ -n "${SKIP_VULNERABILITY_SCAN}" ]; then
            # The detect step checked the approval; the report gives the registry's reason, never the caller's text.
            note="skipped as approved in the Store registry: ${approved}"
          elif [ ! -s "${old}" ]; then
            note="no comparison target"
          else
            if [ -z "${image}" ]; then rebuilt_new=true
            elif [ -n "${scan_published}" ]; then
              # The image users would install from this PR; pulled, not built.
              no_cntrl "${image}" "${id}: the image in ${path} has a control character (newline, tab...): ${image}" || exit 1
              new_ref="$(amd64_ref "${image}" "${version}")"
            elif [ -z "${SBOM_ARTIFACT}" ]; then
              fail "${id} has a prebuilt image but the caller passes no sbom_artifact; run the addon-sbom action after the amd64 build and pass sbom_artifact: upgrade-comparison-sbom-*"
              status=1
            # shellcheck disable=SC2053 # SBOM_ARTIFACT is a glob on purpose
            elif [[ "${artifact}" != ${SBOM_ARTIFACT} ]]; then
              fail "${id}: sbom_artifact '${SBOM_ARTIFACT}' does not match ${artifact}, the artifact the addon-sbom action uploads for component ${id}"
              status=1
            fi
            # The comparison target's image, as users run it now.
            old_image="$(yq -r '.image // ""' "${old}")"
            if [ -z "${old_image}" ]; then rebuilt_old=true
            else
              no_cntrl "${old_image}" "${id}: the comparison target ${target} has a control character (newline, tab...) in its image: ${old_image}" || exit 1
              ref="$(amd64_ref "${old_image}" "${old_version}")"
            fi
          fi
          jq -nc --arg id "${id}" --arg notes "${notes}" --arg new "${new}" --arg target "${target}" --arg ref "${ref}" \
            --arg new_ref "${new_ref}" --arg artifact "${artifact}" --argjson rebuilt_old "${rebuilt_old}" --argjson rebuilt_new "${rebuilt_new}" \
            --arg note "${note}" '$ARGS.named' >> plan.jsonl
        done < changed.jsonl
        if [ -n "$(jq -r 'select(.ref != "" or .rebuilt_old or .rebuilt_new) | .id' plan.jsonl)" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; else echo "scan=false" >> "$GITHUB_OUTPUT"; fi
        # Only a new image built by the caller hands over its SBOM as an artifact; a published one is pulled, a rebuilt one
        # comes from the runtime job.
        if [ -n "$(jq -r 'select((.ref != "" or .rebuilt_old) and .new_ref == "" and (.rebuilt_new | not)) | .id' plan.jsonl)" ]; then
          echo "wait=true" >> "$GITHUB_OUTPUT"; else echo "wait=false" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$(jq -r 'select(.rebuilt_old or .rebuilt_new) | .id' plan.jsonl)" ]; then echo "rebuilt=true" >> "$GITHUB_OUTPUT"; else echo "rebuilt=false" >> "$GITHUB_OUTPUT"; fi
        exit "${status}"
    # While the caller's amd64 build is still running: scanners, DB and the old images' SBOMs.
    - name: Install pinned Syft and Grype
      if: steps.plan.outputs.scan == 'true'
      run: bash tooling/.github/actions/addon-sbom/install-scanners.sh "$RUNNER_TEMP/scanners" syft grype
    - name: Update the vulnerability database
      if: steps.plan.outputs.scan == 'true'
      run: |
        set -euo pipefail
        export GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/grype-db" GRYPE_CHECK_FOR_APP_UPDATE=false
        # Fetched once, alone, before any scan; both images are then scanned with this DB.
        if ! "$RUNNER_TEMP/scanners/grype" db update; then
          echo "::error title=Vulnerability database::grype db update failed (download or validation); re-run the check"; exit 1
        fi
        "$RUNNER_TEMP/scanners/grype" db status -o json > "$RUNNER_TEMP/db-status.json"
        built="$(jq -er '.built' "$RUNNER_TEMP/db-status.json")"
        age=$(( $(date -u +%s) - $(date -u -d "${built}" +%s) ))
        echo "Vulnerability database built ${built} ($(( age / 3600 ))h ago, limit ${DB_MAX_AGE_HOURS}h)"
        if [ "${age}" -gt $(( DB_MAX_AGE_HOURS * 3600 )) ]; then
          echo "::error title=Vulnerability database::the Grype DB was built ${built}, more than ${DB_MAX_AGE_HOURS}h ago; refusing to judge with stale data"; exit 1
        fi
    # With scan_published_image also the new image the PR's config names: its SBOM goes where a downloaded artifact would.
    - name: SBOMs of the comparison targets' images
      if: steps.plan.outputs.scan == 'true'
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        source tooling/.addon-sync/images.sh
        export SYFT_CHECK_FOR_APP_UPDATE=false
        mkdir -p sboms
        while IFS= read -r row; do
          fields "${row}" id=id target=target ref=ref new_ref=new_ref
          # No ref: the comparison target was built on the device; its SBOM comes from the runtime job (#146).
          if [ -n "${ref}" ] && ! docker pull --quiet --platform linux/amd64 "${ref}"; then
            fail "${id}: cannot pull the comparison target's image ${ref} from the registry; re-run, or check that the image of ${target} exists"; exit 1
          fi
          if [ -n "${new_ref}" ] && ! docker pull --quiet --platform linux/amd64 "${new_ref}"; then
            fail "${id}: $(unpublished_reason "${new_ref}")"; exit 1
          fi
          for side in old new; do
            image="${ref}"; sbom="$RUNNER_TEMP/${id}.old.syft.json"
            if [ "${side}" = old ]; then [ -n "${ref}" ] || continue; fi
            if [ "${side}" = new ]; then [ -n "${new_ref}" ] || continue; image="${new_ref}"; sbom="sboms/${id}.syft.json"; fi
            if ! "$RUNNER_TEMP/scanners/syft" scan "docker:${image}" --config tooling/.github/actions/addon-sbom/syft.yaml -o "syft-json=${sbom}"; then
              fail "${id}: Syft could not read ${image}"; exit 1
            fi
            docker image rm --force "${image}" > /dev/null
          done
        done < <(jq -c 'select(.ref != "" or .new_ref != "")' plan.jsonl)
    # The caller does not make this job wait on its build (`needs:`), so a PR that changes no
    # version passes in seconds; only here, after a version change, does the job wait for the
    # addon-sbom artifact of this same run.
    - name: Wait for the new images' SBOMs
      if: steps.detect.outputs.changed == 'true' && steps.plan.outputs.wait == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        WAIT_MINUTES: ${{ inputs.sbom_wait_minutes }}
      run: |
        set -euo pipefail
        # Only this attempt's artifact (plan.jsonl names it -attempt-<N>): a re-run judges its own build.
        # With scan_published_image (new_ref) the new image is pulled and scanned instead: no SBOM to wait for (#147, #148);
        # one built on the device comes from the runtime job (#146).
        jq -r 'select((.ref != "" or .rebuilt_old) and .new_ref == "" and (.rebuilt_new | not)) | [.id, .artifact] | @tsv' plan.jsonl > wanted-sboms.tsv
        bash tooling/.addon-sync/wait_artifacts.sh wanted-sboms.tsv artifacts.tsv "SBOM of the new image" addon-sbom
    - name: Download the new images' SBOMs
      if: steps.plan.outputs.wait == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p sboms
        while IFS=$'\t' read -r id artifact_id; do
          gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/${id}.sbom.zip"
          unzip -o -q "$RUNNER_TEMP/${id}.sbom.zip" "${id}.syft.json" -d sboms
        done < artifacts.tsv
    # #146: images built on the device are rebuilt only in the runtime job (for the upgrade test, or only for these SBOMs
    # when the registry skips that test), which makes their SBOMs with the same pinned Syft and hands them over. compare
    # runs after runtime (needs), so the artifact is there or never will be: no wait. Without it, "Compare with the
    # comparison target" fails each add-on that needs one.
    - name: Download the rebuilt images' SBOMs
      if: steps.plan.outputs.rebuilt == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        artifact="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
          --jq ".artifacts[] | select(.name == \"upgrade-comparison-rebuilt-sboms-attempt-${RUN_ATTEMPT}\") | .id" | tail -n1)"
        [ -n "${artifact}" ] || exit 0
        mkdir -p rebuilt-sboms
        if ! { gh api "repos/${REPO}/actions/artifacts/${artifact}/zip" > "$RUNNER_TEMP/rebuilt-sboms.zip" \
            && unzip -o -q "$RUNNER_TEMP/rebuilt-sboms.zip" -d rebuilt-sboms; }; then
          fail "cannot download the SBOMs of the rebuilt images (artifact upgrade-comparison-rebuilt-sboms-attempt-${RUN_ATTEMPT}); re-run all jobs"; exit 1
        fi
    - name: Compare with the comparison target
      if: steps.detect.outputs.changed == 'true'
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        export GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/grype-db" GRYPE_DB_AUTO_UPDATE=false GRYPE_DB_VALIDATE_AGE=true \
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE="${DB_MAX_AGE_HOURS}h" GRYPE_CHECK_FOR_APP_UPDATE=false
        status=0
        while IFS= read -r row; do
          fields "${row}" id=id notes=notes new=new target=target ref=ref new_ref=new_ref note=note \
            rebuilt_old='rebuilt_old // false' rebuilt_new='rebuilt_new // false'
          old="$RUNNER_TEMP/${id}.old.yaml"
          args=(--name "${id}" --new "${new}" --notes "source/${notes}" --notes-path "${notes}")
          [ ! -s "${old}" ] || args+=(--old "${old}")
          # Each side's SBOM: a rebuilt image's from the runtime job (#146), else the pulled target's (made above) and the
          # caller's or the published new image's (downloaded or made above).
          old_sbom="$RUNNER_TEMP/${id}.old.syft.json"; [ "${rebuilt_old}" != true ] || old_sbom="rebuilt-sboms/${id}.old.syft.json"
          new_sbom="sboms/${id}.syft.json"; [ "${rebuilt_new}" != true ] || new_sbom="rebuilt-sboms/${id}.new.syft.json"
          if [ -z "${ref}" ] && [ "${rebuilt_old}" != true ]; then
            args+=(--scan-note "${note}")
          elif { [ "${rebuilt_old}" = true ] && [ ! -s "${old_sbom}" ]; } || { [ "${rebuilt_new}" = true ] && [ ! -s "${new_sbom}" ]; }; then
            # Fail closed: a rebuilt side without its SBOM fails, with the reason the runtime job recorded.
            if [ ! -d rebuilt-sboms ]; then
              fail "${id}: the runtime job handed over no SBOMs of the rebuilt images; its log has the reason"
            elif [ -s "rebuilt-sboms/${id}.json" ]; then
              fail "${id}: the vulnerability comparison cannot run without the SBOMs of both images: $(jq -r '.reasons | join("; ")' "rebuilt-sboms/${id}.json")"
            else
              fail "${id}: the runtime job handed over no SBOM of this add-on's rebuilt image; its log has the reason"
            fi
            status=1; continue
          elif [ ! -s "${new_sbom}" ]; then
            fail "${id}: the SBOM artifact of this attempt holds no ${id}.syft.json"; status=1; continue
          else
            for side in old new; do
              sbom="${old_sbom}"; [ "${side}" = old ] || sbom="${new_sbom}"
              if ! "$RUNNER_TEMP/scanners/grype" "sbom:${sbom}" -o json --file "$RUNNER_TEMP/${id}.${side}.grype.json"; then
                fail "${id}: Grype could not scan the ${side} image's SBOM"; status=1; continue 2
              fi
            done
            old_desc="$(esc "${ref}") ($(esc "${target}"))"; [ "${rebuilt_old}" != true ] || old_desc="$(esc "${target}") rebuilt"
            new_desc="$(esc "${new_ref:-the PR image}")"; [ "${rebuilt_new}" != true ] || new_desc="the PR image rebuilt"
            echo "${id}: scanned ${old_desc} and ${new_desc} with the same DB"
            args+=(--old-scan "$RUNNER_TEMP/${id}.old.grype.json" --new-scan "$RUNNER_TEMP/${id}.new.grype.json")
          fi
          rc=0; python3 tooling/.addon-sync/upgrade_check.py compare "${args[@]}" || rc=$?
          [ "${rc}" = 0 ] || status=1
        done < plan.jsonl
        exit "${status}"
    # Category 2 (#137): the runtime job's verdict, whatever happened in the steps above.
    - name: Upgrade test result
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUNTIME_RESULT: ${{ needs.runtime.result }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        mkdir -p runtime-reports; status=0
        artifact="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
          --jq ".artifacts[] | select(.name == \"upgrade-comparison-runtime-attempt-${RUN_ATTEMPT}\") | .id" | tail -n1)"
        if [ -n "${artifact}" ] && ! { gh api "repos/${REPO}/actions/artifacts/${artifact}/zip" > "$RUNNER_TEMP/runtime-reports.zip" \
            && unzip -o -q "$RUNNER_TEMP/runtime-reports.zip" -d runtime-reports; }; then
          fail "cannot download the upgrade test results (artifact upgrade-comparison-runtime-attempt-${RUN_ATTEMPT}); re-run all jobs"; exit 1
        fi
        echo "## Upgrade test" >> "$GITHUB_STEP_SUMMARY"
        for result in runtime-reports/*.json; do
          [ -e "${result}" ] || break
          # upgrade_runtime.py's result, the runtime job's note on why the test did not run, or why that job failed.
          id="$(jq -r '.name' "${result}")"
          # #138: data was checked only when verify ran (data_checked; absent in results from before #138). verify runs
          # only after seed, when there is one, passed. A test that failed before verify did not check data.
          if jq -e '.data_checked == true' "${result}" > /dev/null; then
            if jq -e '(.hooks // []) | index("seed")' "${result}" > /dev/null; then scope="data checked by seed and verify (已檢查資料)"
            else scope="data checked by verify, no seed (已檢查資料)"; fi
          elif jq -e '(.hooks // []) | index("verify")' "${result}" > /dev/null; then
            scope="data was not checked: the test failed before verify ran (沒有檢查資料)"
          else scope="startup only: data was not checked (只檢查啟動，沒有檢查資料)"; fi
          case "$(jq -r '.passed' "${result}")" in
            true) echo "- ${id}: passed, ${scope}" >> "$GITHUB_STEP_SUMMARY";;
            false) fail "${id}: upgrade test failed: $(jq -r '.reason' "${result}") (the report below and the runtime job's summary have the details)"; status=1
              echo "- ${id}: **failed**, ${scope}" >> "$GITHUB_STEP_SUMMARY";;
            *) echo "- ${id}: not run ($(jq -r '.note' "${result}"))" >> "$GITHUB_STEP_SUMMARY";;
          esac
          # #141: the data-check deadline (registry upgrade_comparison.data_check_due, a UTC date) of each add-on with a result
          # (plan.jsonl gives its directory). Without upgrade-check/verify in the PR it passes with the days left through the
          # due date and fails from the day after; with verify, or with no due date, nothing. An add-on whose test ran (passed
          # or failed) is judged; one whose test did not run (passed null) is not judged only for the runtime job's not_run
          # codes no_target (no comparison target) and approved_skip (the registry's skip_upgrade_test). Every other one, the
          # caller's missing image_artifact (no_image_artifact, #143) or a reason unknown here, is judged (fail closed): only
          # the registry decides, no caller input waives the deadline. Add-ons built on the device are judged, since #144
          # tests them. The "runtime job" record is not an add-on and is not judged. The due dates of every add-on are also
          # checked on every PR (upgrade_check.py components, in "Find add-ons whose version changed").
          # DATA_CHECK_TODAY (YYYY-MM-DD) is only for the tests; the workflow judges the UTC date of the run.
          # TODO(#140): target_failed/addon_failed (log.sh) write hooks [] whatever upgrade-check/ has; verify is therefore read from
          # the PR's upgrade-check/ here. Once target_failed records the hooks the add-on has, this can read the result.
          not_run="$(jq -r 'if .passed == true or .passed == false then "" else (.not_run // "unknown" | tostring) end' "${result}")"
          case "${not_run}" in no_target|approved_skip) continue;; esac
          [ "${id}" != "runtime job" ] || continue
          # Why an overdue add-on had no test, so the message says what else to do.
          hint=""; [ -z "${not_run}" ] || hint="; 升級測試沒跑 (the upgrade test did not run: $(jq -r '.note // "no reason given"' "${result}"))"
          [ "${not_run}" != no_image_artifact ] || hint="${hint}: add verify, and pass image_artifact (the addon-image action, #143) so the test runs"
          notes="$(jq -r --arg id "${id}" 'select(.id == $id) | .notes' plan.jsonl 2> /dev/null | head -n1)" || notes=""
          if [ -z "${notes}" ]; then
            fail "${id}: the upgrade test has a result for this add-on, but this job's plan does not list it, so its data-check deadline cannot be judged; re-run all jobs"
            status=1; echo "- ${id}: **data-check deadline not judged: not in this job's plan**" >> "$GITHUB_STEP_SUMMARY"; continue
          fi
          rc=0; due="$(python3 tooling/.addon-sync/upgrade_check.py data-check-due --registry tooling/.addon-sync/registry.json --repo "${REPO}" \
            --component "${id}" --addon-dir "source/$(dirname "${notes}")" ${DATA_CHECK_TODAY:+--today "${DATA_CHECK_TODAY}"})" || rc=$?
          case "${rc}" in
            0) [ -z "${due}" ] || echo "- ${id}: ${due}" >> "$GITHUB_STEP_SUMMARY";;
            3) fail "${id}: ${due}${hint}"; status=1; echo "- ${id}: **${due}${hint}**" >> "$GITHUB_STEP_SUMMARY";;
            # 2: its ::error line, printed as is. Anything else (a crash) gets one, so it never passes silently.
            *) if [ "${rc}" = 2 ]; then printf '%s\n' "${due}"; else fail "${id}: the data-check deadline could not be judged: upgrade_check.py data-check-due exited ${rc}"; fi
              status=1; echo "- ${id}: **data-check deadline could not be judged (upgrade_check.py data-check-due exited ${rc}); the log has the error**" >> "$GITHUB_STEP_SUMMARY";;
          esac
        done
        # upgrade_runtime.py's report of each add-on: both versions' startup and every check of its hooks.
        for report in runtime-reports/*.md; do
          [ -e "${report}" ] || break
          { echo; cat "${report}"; } >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "${RUNTIME_RESULT}" != success ] && [ "${status}" = 0 ]; then
          fail "the runtime job (upgrade test) ended ${RUNTIME_RESULT} with no failing add-on result; its log has the reason"; status=1
        fi
        exit "${status}"
  # Category 2: the upgrade test of each add-on whose version changed: startup (#137), the seed/verify data hooks (#138),
  # the registry's approved skips and comparison-target failures (#140), add-ons built on the device rebuilt here (#144).
  runtime:
    name: runtime
    runs-on: ubuntu-latest
    # Per add-on: up to two builds when built on the device (#144; an HA Core base is ~4 GB, pulled once per run), then
    # each version's startup (startup_timeout 300 s + stable_seconds 60 s by default) and its hooks (hook_timeout 600 s).
    # A repository like apporo bumps up to five add-ons in one PR, so 90 minutes could run out; GitHub allows 360.
    # With smoke on both versions (#139) one add-on whose every wait runs out takes 2 x (300 + 60) s + 4 x 600 s of
    # hooks = 52 minutes (plus its builds), so 150 is not a bound for several such add-ons: a job that runs out of
    # time fails compare (runtime did not succeed), it never passes. The Syft SBOM after each build (#146) adds little:
    # on the apporo pilot (one HA Core add-on, 2026-11-06) both builds with their SBOMs took 2 minutes and the whole job
    # 4.5, so five such add-ons stay far below 150.
    timeout-minutes: 150
    env:
      # Every fail (log.sh) of this job is also written here; "Record why the runtime job failed" hands it to compare.
      FAIL_LOG: ${{ github.workspace }}/runtime-failures.txt
    steps:
    - *not-pr
    - *checkout-pr
    - *checkout-tooling
    - *install
    - *detect
    - *plan
    # #140: an add-on whose upgrade test cannot run (categories 2 and 3) is skipped only when its Store registry entry
    # approves it (upgrade_comparison.skip_upgrade_test, the reason and its ticket); the report gives that reason. The
    # registry alone decides, so there is no caller input; an upgrade-check/settings.yaml that asks for the skip without
    # the approval fails. The skip is of the test only (#146): a skipped add-on stays in this job's plan.jsonl marked
    # skipped, so its images built on the device are still rebuilt for the vulnerability comparison (category 4), but it
    # is never started or tested, and its result stays this one.
    - name: Skip the upgrade tests the registry approves
      if: steps.detect.outputs.changed == 'true'
      env:
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        mkdir -p runtime-reports; : > plan.tested.jsonl
        while IFS= read -r row; do
          fields "${row}" id=id notes=notes
          reason="$(python3 tooling/.addon-sync/upgrade_check.py upgrade-test-skip --registry tooling/.addon-sync/registry.json --repo "${REPO}" \
            --component "${id}" --settings "source/$(dirname "${notes}")/upgrade-check/settings.yaml")" || fail_output "${reason}"
          if [ -z "${reason}" ]; then printf '%s\n' "${row}" >> plan.tested.jsonl; continue; fi
          note="categories 2 and 3 skipped as approved in the Store registry: ${reason}"
          # not_run: why the test did not run, for compare's data-check deadline (#141).
          jq -n --arg name "${id}" --arg note "${note}" '{name: $name, passed: null, skipped: true, not_run: "approved_skip", note: $note}' > "runtime-reports/${id}.json"
          echo "- ${id}: upgrade test not run (${note})" >> "$GITHUB_STEP_SUMMARY"
          jq -c '.skipped = true' <<<"${row}" >> plan.tested.jsonl
        done < plan.jsonl
        mv plan.tested.jsonl plan.jsonl
    - name: Plan the upgrade tests
      id: upgrade
      if: steps.detect.outputs.changed == 'true'
      env:
        IMAGE_ARTIFACT: ${{ inputs.image_artifact }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        source tooling/.addon-sync/images.sh
        # upgrade.jsonl, one object per add-on: id, addon_dir, new, test (whether it is tested), sbom (#146: the images this
        # job builds for it get SBOMs for compare's category 4; an add-on whose test the registry skips is built only for
        # them: test false, sbom true), artifact, old_ref (the comparison target's prebuilt image to pull; "" = rebuilt),
        # old_src (the target's tag or commit to rebuild it from, #144), new_src and new_ref (with new_src published, the new
        # image to pull; else "").
        # new_src, where the new image comes from; every later step compares it with one of these names, never with "":
        #   artifact   the caller's addon-image artifact: "Wait for the new images" and "Load the new images"
        #   pr         built from the PR checkout (#144): "Build the images of add-ons built on the device"
        #   published  pulled from the registry (#154): "Pull the images"
        # The provider's scan_published_image approval (#147, #148), as the plan step reads it: the shipped image is the
        # published one the PR's config names, not one the caller's PR builds, so it is the one tested (#154).
        scan_published="$(jq -r '.scan_published_image' provider.json)"
        mkdir -p runtime-reports; : > upgrade.jsonl; status=0
        while IFS= read -r row; do
          fields "${row}" id=id notes=notes new=new target=target skipped='skipped // false' rebuilt_old='rebuilt_old // false' rebuilt_new='rebuilt_new // false'
          old="$RUNNER_TEMP/${id}.old.yaml"; image="$(yq -r '.image // ""' "${new}")"; note=""; not_run=""; old_ref=""; old_src=""; new_src=artifact; new_ref=""
          artifact="upgrade-comparison-image-${id}-attempt-${RUN_ATTEMPT}"
          # The plan's category 4 sides built on the device (#146); the same sides this job builds for the test.
          sbom=false; if [ "${rebuilt_old}" = true ] || [ "${rebuilt_new}" = true ]; then sbom=true; fi
          if [ "${skipped}" = true ]; then
            # The registry skips the test (the step above wrote its result); only its category 4 images are built.
            [ "${sbom}" = true ] || continue
            [ "${rebuilt_old}" != true ] || old_src="${target}"
            [ "${rebuilt_new}" != true ] || new_src=pr
            jq -nc --arg id "${id}" --arg addon_dir "source/$(dirname "${notes}")" --arg new "${new}" --argjson test false --argjson sbom true \
              --arg artifact "${artifact}" --arg old_ref "" --arg old_src "${old_src}" --arg new_src "${new_src}" --arg new_ref "" '$ARGS.named' >> upgrade.jsonl
            continue
          fi
          # not_run: why the test does not run, a code for compare's data-check deadline (#141); note says it to people.
          if [ ! -s "${old}" ]; then note="no comparison target"; not_run=no_target
          # Built on the device (no image in the PR's config): this job builds the new image from the PR checkout.
          elif [ -z "${image}" ]; then new_src=pr
          # scan_published_image: the image users would install with this PR, pulled in "Pull the images"; no
          # image_artifact is awaited, so the caller's glob is not checked.
          elif [ -n "${scan_published}" ]; then
            new_version="$(python3 tooling/.addon-sync/upgrade_check.py version --file "${new}" --name "${id}")" || fail_output "${new_version}"
            no_cntrl "${image}${new_version}" "${id}: the PR's config has a control character (newline, tab...) in its image or version" || exit 1
            new_src=published; new_ref="$(amd64_ref "${image}" "${new_version}")"
          elif [ -z "${IMAGE_ARTIFACT}" ]; then note="the caller passes no image_artifact; the upgrade test is being rolled out in #143"; not_run=no_image_artifact
          # shellcheck disable=SC2053 # IMAGE_ARTIFACT is a glob on purpose
          elif [[ "${artifact}" != ${IMAGE_ARTIFACT} ]]; then
            fail "${id}: image_artifact '${IMAGE_ARTIFACT}' does not match ${artifact}, the artifact the addon-image action uploads for component ${id}"
            status=1; continue
          fi
          if [ -z "${note}" ]; then
            old_image="$(yq -r '.image // ""' "${old}")"
            if [ -n "${old_image}" ]; then
              old_version="$(python3 tooling/.addon-sync/upgrade_check.py version --file "${old}" --name "${id}")" || fail_output "${old_version}"
              no_cntrl "${old_image}${old_version}" "${id}: the comparison target ${target} has a control character (newline, tab...) in its image or version" || exit 1
              old_ref="$(amd64_ref "${old_image}" "${old_version}")"
            else
              # Built on the device at the comparison target: rebuilt from its source, its Release tag or, under
              # ref_policy main, the commit on the PR base where its version first appeared (the plan's target).
              old_src="${target}"
            fi
          else
            # Not tested, but a comparison target built on the device is still rebuilt for its category 4 SBOM (#146).
            [ "${rebuilt_old}" != true ] || old_src="${target}"
            jq -n --arg name "${id}" --arg not_run "${not_run}" --arg note "${note}" '{name: $name, passed: null, not_run: $not_run, note: $note}' > "runtime-reports/${id}.json"
            echo "- ${id}: upgrade test not run (${note})" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -nc --arg id "${id}" --arg addon_dir "source/$(dirname "${notes}")" --arg new "${new}" --argjson test "$([ -z "${note}" ] && echo true || echo false)" \
            --argjson sbom "${sbom}" --arg artifact "${artifact}" --arg old_ref "${old_ref}" --arg old_src "${old_src}" --arg new_src "${new_src}" --arg new_ref "${new_ref}" \
            '$ARGS.named' >> upgrade.jsonl
        done < plan.jsonl
        if [ -n "$(jq -r 'select(.test) | .id' upgrade.jsonl)" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$(jq -r 'select((.test or .sbom) and (.old_src != "" or .new_src == "pr")) | .id' upgrade.jsonl)" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$(jq -r 'select(.sbom and (.old_src != "" or .new_src == "pr")) | .id' upgrade.jsonl)" ]; then echo "sbom=true" >> "$GITHUB_OUTPUT"; else echo "sbom=false" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$(jq -r 'select(.test and .new_src == "artifact") | .id' upgrade.jsonl)" ]; then echo "wait=true" >> "$GITHUB_OUTPUT"; else echo "wait=false" >> "$GITHUB_OUTPUT"; fi
        exit "${status}"
    # While the caller's amd64 build is still running.
    - name: Pull the images
      if: steps.upgrade.outputs.run == 'true'
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        source tooling/.addon-sync/images.sh
        # #140: an add-on whose comparison target cannot be pulled fails with the reason (target_failed) and leaves the
        # test (test false); the others are still tested, and "Run the upgrade tests" fails the job for it at the end.
        # #154: with scan_published_image (new_src published) the new image is pulled too, first, so a PR whose version's
        # image is not published is the PR's fault (addon_failed) whatever its comparison target does; the same contract.
        : > pulled.jsonl
        while IFS= read -r row; do
          fields "${row}" id=id ref=old_ref test=test new_src='new_src // "artifact"' new_ref='new_ref // ""'
          if [ "${test}" = true ] && [ "${new_src}" = published ] && ! docker pull --quiet --platform linux/amd64 "${new_ref}"; then
            addon_failed "${id}" "$(unpublished_reason "${new_ref}")"
            row="$(jq -c '.test = false' <<<"${row}")"
          elif [ "${test}" = true ] && [ -n "${ref}" ] && ! docker pull --quiet --platform linux/amd64 "${ref}"; then
            target_failed "${id}" "cannot pull the comparison target's image ${ref} from the registry, so the upgrade cannot be tested; re-run, or check that the image exists"
            row="$(jq -c '.test = false' <<<"${row}")"
          fi
          printf '%s\n' "${row}" >> pulled.jsonl
        done < upgrade.jsonl
        mv pulled.jsonl upgrade.jsonl
    # Add-ons built on the device (#144) have no image to pull or hand over: both are built here for amd64, as
    # Supervisor builds them (upgrade_check.py build-args). The PR's image is built first, from the PR checkout, so a
    # PR that does not build is reported as the PR's fault (addon_failed); then the comparison target's, from GitHub's
    # archive of the target (downloaded once per target, removed at the end of this step). Like a pull (#140), a target
    # that cannot be downloaded or rebuilt fails that add-on (target_failed); either way the others are still tested.
    # Category 4 (#146): right after each image builds, the same pinned Syft and syft.yaml as compare's make its SBOM in
    # rebuilt-sboms/<id>.<old|new>.syft.json, which "Upload the rebuilt images' SBOMs" hands to compare (scanned there with
    # its one Grype DB). A side with no SBOM (not built, not downloaded, Syft failed) has its reason in rebuilt-sboms/<id>.json,
    # and compare fails category 4 with it. An add-on whose test the registry skips (test false, sbom true) is built only for
    # its SBOMs: a failure is recorded there only, never as an upgrade test result (that stays approved_skip), and its images
    # are removed right after their SBOMs.
    - name: Install pinned Syft
      if: steps.upgrade.outputs.sbom == 'true'
      run: bash tooling/.github/actions/addon-sbom/install-scanners.sh "$RUNNER_TEMP/scanners" syft
    - name: Build the images of add-ons built on the device
      if: steps.upgrade.outputs.build == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        source tooling/.addon-sync/fields.sh
        export SYFT_CHECK_FOR_APP_UPDATE=false
        mkdir -p rebuilt-sboms
        # no_sbom <id> <reason>: one side of <id> has no SBOM, for <reason> (compare quotes them all).
        no_sbom() {
          local file="rebuilt-sboms/$1.json"
          [ -s "${file}" ] || echo '{"reasons": []}' > "${file}"
          jq --arg reason "$2" '.reasons += [$reason]' "${file}" > "${file}.tmp" && mv "${file}.tmp" "${file}"
        }
        # sbom_of <id> <old|new>: Syft's SBOM of upgrade-comparison/<id>:<side>; on failure the reason is recorded.
        sbom_of() {
          if ! "$RUNNER_TEMP/scanners/syft" scan "docker:upgrade-comparison/$1:$2" --config tooling/.github/actions/addon-sbom/syft.yaml \
              -o "syft-json=rebuilt-sboms/$1.$2.syft.json"; then
            local reason="Syft could not read the rebuilt $2 image upgrade-comparison/$1:$2"
            printf '::error title=Upgrade comparison failed::%s\n' "$(esc "$1: ${reason}")"
            rm -f "rebuilt-sboms/$1.$2.syft.json"; no_sbom "$1" "${reason}"
          fi
        }
        # build <id> <old|new> <add-on directory> <its config.yaml>: tags upgrade-comparison/<id>:<old|new>. On failure it
        # returns 1 and leaves the reason in why: the tool's error (version, build-args) or docker build's exit code.
        why=""
        build() {
          local version spec rc=0 args=()
          if ! version="$(python3 tooling/.addon-sync/upgrade_check.py version --file "$4" --name "$1")"; then why="${version#::error title=*::}"; return 1; fi
          if ! spec="$(python3 tooling/.addon-sync/upgrade_check.py build-args --addon-dir "$3" --version "${version}" --name "$1")"; then
            why="${spec#::error title=*::}"; return 1
          fi
          while IFS= read -r arg; do args+=(--build-arg "${arg}"); done < <(jq -r '.args | to_entries[] | "\(.key)=\(.value)"' <<<"${spec}")
          docker build --platform linux/amd64 -f "$(jq -r '.dockerfile' <<<"${spec}")" "${args[@]}" -t "upgrade-comparison/$1:$2" "$3" || rc=$?
          if [ "${rc}" != 0 ]; then why="docker build exited with code ${rc}; its log is in the step 'Build the images of add-ons built on the device'"; return 1; fi
        }
        # dir_of <tree> <config> <previous_config>: the add-on's directory in <tree>, where its config is (previous_config
        # during a move), as the detect and plan steps found it with config_at.
        dir_of() {
          if [ -e "$1/$2" ] || [ -z "$3" ]; then printf '%s/%s' "$1" "$(dirname "$2")"; else printf '%s/%s' "$1" "$(dirname "$3")"; fi
        }
        # The extracted source of each comparison target, by its tag or commit: add-ons sharing one download it once.
        declare -A trees=()
        : > built.jsonl
        while IFS= read -r row; do
          fields "${row}" id=id new=new old_src=old_src new_src='new_src // "artifact"' test=test sbom='sbom // false'
          fields "$(jq -c --arg id "${id}" '.components[] | select(.id == $id)' provider.json)" path=config previous=previous_config
          # failed <addon_failed|target_failed> <reason for the test> [<reason for category 4>]: this add-on's build failed; a
          # tested one fails its upgrade test, and its missing SBOM gets the second reason (default the first). An add-on
          # built only for its SBOMs prints the second as an error, never an upgrade test result. Building stops for it.
          failed() {
            local why4="${3:-$2}"
            if [ "${test}" = true ]; then "$1" "${id}" "$2"; else printf '::error title=Upgrade comparison failed::%s\n' "$(esc "${id}: ${why4}")"; fi
            [ "${sbom}" != true ] || no_sbom "${id}" "${why4}"
            want=false; test=false
          }
          # want: this add-on's images are built, for its test, its SBOMs (#146), or both.
          want=false; if [ "${test}" = true ] || [ "${sbom}" = true ]; then want=true; fi
          if [ "${want}" = true ] && [ "${new_src}" = pr ]; then
            if ! build "${id}" new "$(dir_of source "${path}" "${previous}")" "${new}"; then
              failed addon_failed "the new version could not be built for amd64 from this PR: ${why}"
            elif [ "${sbom}" = true ]; then
              sbom_of "${id}" new
              # Only for its SBOM: removed at once, so the next build has the disk.
              [ "${test}" = true ] || docker image rm --force "upgrade-comparison/${id}:new" > /dev/null 2>&1 || true
            fi
          fi
          if [ "${want}" = true ] && [ -n "${old_src}" ]; then
            tree="${trees[${old_src}]:-}"
            if [ -z "${tree}" ]; then
              tree="$RUNNER_TEMP/old-src-${#trees[@]}"; archive="${tree}.tar.gz"; rm -rf "${tree}"; mkdir -p "${tree}"
              # The tag or commit is a path segment of the API URL: percent-encoded (a tag may hold / or other reserved characters).
              if gh api "repos/${REPO}/tarball/$(jq -rn --arg ref "${old_src}" '$ref | @uri')" > "${archive}" \
                  && tar -xzf "${archive}" -C "${tree}" --strip-components=1; then
                trees[${old_src}]="${tree}"
              else
                rm -rf "${tree}"; tree=""
              fi
              rm -f "${archive}"
            fi
            if [ -z "${tree}" ]; then
              failed target_failed "cannot download the source of the comparison target ${old_src} to rebuild its image, so the upgrade cannot be tested; re-run the check" \
                "cannot download the source of the comparison target ${old_src} to rebuild its image; re-run the check"
            elif ! build "${id}" old "$(dir_of "${tree}" "${path}" "${previous}")" "$RUNNER_TEMP/${id}.old.yaml"; then
              failed target_failed "the comparison target ${old_src} could not be rebuilt for amd64, so the upgrade cannot be tested: ${why}" \
                "the comparison target ${old_src} could not be rebuilt for amd64: ${why}"
            elif [ "${sbom}" = true ]; then
              sbom_of "${id}" old
              [ "${test}" = true ] || docker image rm --force "upgrade-comparison/${id}:old" > /dev/null 2>&1 || true
            fi
          fi
          jq -c --argjson test "${test}" '.test = $test' <<<"${row}" >> built.jsonl
        done < upgrade.jsonl
        mv built.jsonl upgrade.jsonl
        # The images are built; their sources are no longer needed (an HA Core tree is tens of MB, its image GBs).
        rm -rf "$RUNNER_TEMP"/old-src-*
    - name: Wait for the new images
      if: steps.upgrade.outputs.wait == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        WAIT_MINUTES: ${{ inputs.image_wait_minutes }}
      run: |
        set -euo pipefail
        # Only the caller's builds hand over an artifact; images built on the device were built in the step above, and
        # published ones (scan_published_image, #154) were pulled.
        jq -r 'select(.test and .new_src == "artifact") | [.id, .artifact] | @tsv' upgrade.jsonl > wanted-images.tsv
        bash tooling/.addon-sync/wait_artifacts.sh wanted-images.tsv images.tsv "new image" addon-image
    - name: Load the new images
      if: steps.upgrade.outputs.wait == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        source tooling/.addon-sync/log.sh
        while IFS=$'\t' read -r id artifact_id; do
          gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/${id}.image.zip"
          unzip -o -q "$RUNNER_TEMP/${id}.image.zip" "${id}.tar" -d "$RUNNER_TEMP/images"
          rm -f "$RUNNER_TEMP/${id}.image.zip"
          # The addon-image action saved it under this tag: what CI built in this attempt, not rebuilt here.
          docker load -i "$RUNNER_TEMP/images/${id}.tar"
          rm -f "$RUNNER_TEMP/images/${id}.tar"
          if ! docker image inspect "upgrade-comparison/${id}:new" > /dev/null 2>&1; then
            fail "${id}: the image artifact holds no upgrade-comparison/${id}:new; use the Store addon-image action"; exit 1
          fi
        done < images.tsv
    - name: Run the upgrade tests
      if: steps.upgrade.outputs.run == 'true'
      run: |
        set -euo pipefail
        source tooling/.addon-sync/fields.sh
        status=0
        while IFS= read -r row; do
          fields "${row}" id=id addon_dir=addon_dir new=new ref=old_ref old_src='old_src // ""' new_src='new_src // "artifact"' new_ref='new_ref // ""'
          # A comparison target built on the device was rebuilt as upgrade-comparison/<id>:old (a local image, never pulled).
          old_image="${ref:-upgrade-comparison/${id}:old}"
          # The new image: the published one pulled by its ref (#154, so the report names it), else the caller's artifact or
          # the image built here, both upgrade-comparison/<id>:new.
          new_image="upgrade-comparison/${id}:new"; if [ "${new_src}" = published ]; then new_image="${new_ref}"; fi
          rc=0; python3 tooling/.addon-sync/upgrade_runtime.py --name "${id}" --addon-dir "${addon_dir}" \
            --old-image "${old_image}" --old-config "$RUNNER_TEMP/${id}.old.yaml" --new-image "${new_image}" --new-config "${new}" \
            --report-dir runtime-reports --summary "$GITHUB_STEP_SUMMARY" || rc=$?
          [ "${rc}" = 0 ] || status=1
          # Images built on the device (#144) are removed once tested, so the next add-on's builds have the disk. The
          # build cache is kept: add-ons of one repository share their base image (apporo: one HA Core for five).
          if [ -n "${old_src}" ]; then docker image rm --force "upgrade-comparison/${id}:old" > /dev/null 2>&1 || true; fi
          if [ "${new_src}" = pr ]; then docker image rm --force "upgrade-comparison/${id}:new" > /dev/null 2>&1 || true; fi
        done < <(jq -c 'select(.test)' upgrade.jsonl)
        # An add-on an earlier step could not test (target_failed, #140; a PR built on the device that does not build, #144) fails this job too.
        if jq -e -s 'any(.[]; .passed == false)' runtime-reports/*.json > /dev/null 2>&1; then status=1; fi
        exit "${status}"
    # A step that failed before upgrade_runtime.py wrote a result (plan, pull, wait, load) leaves its reasons in
    # FAIL_LOG; compare quotes them instead of only saying that this job failed. When upgrade_runtime.py already
    # wrote why an add-on failed, that is the reason: a second entry would only say that this job failed.
    - name: Record why the runtime job failed
      if: failure() && github.event_name == 'pull_request'
      run: |
        set -euo pipefail
        mkdir -p runtime-reports
        if [ -s "${FAIL_LOG}" ]; then reason="$(cat "${FAIL_LOG}")"
        elif jq -e -s 'any(.[]; .passed == false)' runtime-reports/*.json > /dev/null 2>&1; then exit 0
        else reason="a step failed without a reason; the runtime job's log has it"; fi
        jq -n --arg reason "${reason}" '{name: "runtime job", passed: false, reason: $reason}' > runtime-reports/runtime-job.json
    - name: Upload the upgrade test results
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        # compare reads this attempt's results; the run attempt keeps a re-run from reading an earlier one.
        name: upgrade-comparison-runtime-attempt-${{ github.run_attempt }}
        path: runtime-reports/
        if-no-files-found: ignore
        retention-days: 7
    # #146: the SBOMs of the images built on the device, and why a side has none, for compare's category 4 ("Download the
    # rebuilt images' SBOMs"). Uploaded whatever happened, so compare reads what there is, and fails without it.
    - name: Upload the rebuilt images' SBOMs
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: upgrade-comparison-rebuilt-sboms-attempt-${{ github.run_attempt }}
        path: rebuilt-sboms/
        if-no-files-found: ignore
        retention-days: 7
