name: Synchronize validated WOOW addons and Local Download
'on':
  workflow_dispatch:
    inputs:
      only:
        description: Optional addon ID to limit this run; empty (and every schedule or dispatch run) means all registered stable addons
        required: false
        type: string
        default: ''
  repository_dispatch:
    types:
    - upstream-release
    - woow-addon-ready
  schedule:
  - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: woow-addon-distribution
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - run: python3 -m pip install -r .addon-sync/requirements.txt
    - name: Test synchronization and downloader guards
      run: python3 .addon-sync/test_addon_sync.py -v
    - name: Consume notifications and update Store
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ONLY_ADDON: ${{ inputs.only }}
      run: 'set -euo pipefail

        args=()

        if [ -n "$ONLY_ADDON" ]; then args+=(--only "$ONLY_ADDON"); fi

        python3 .addon-sync/addon_sync.py consume --registry .addon-sync/registry.json --workspace . "${args[@]}"

        python3 .addon-sync/rebrand_sync.py store-commit --store . --push

        '
    - name: Synchronize rebrand Local Download only
      env:
        REBRAND_KEY: ${{ secrets.REBRAND_SYNC_SSH_KEY }}
      run: 'set -euo pipefail

        test -n "$REBRAND_KEY" || { echo ''::error::Missing dedicated rebrand deploy key''; exit 1; }

        key="$RUNNER_TEMP/woow-rebrand-deploy-key"

        trap ''rm -f "$key"'' EXIT

        umask 077

        printf ''%s

        '' "$REBRAND_KEY" > "$key"

        export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.addon-sync/github_known_hosts"

        target="$RUNNER_TEMP/ha-rebrand-download-sync"

        git init "$target"

        git -C "$target" remote add origin git@github.com:WOOWTECH/ha-rebrand.git

        git -C "$target" sparse-checkout init --cone

        git -C "$target" sparse-checkout set release/addons

        git -C "$target" fetch --depth=1 --filter=blob:none origin main

        git -C "$target" checkout -B main FETCH_HEAD

        python3 .addon-sync/rebrand_sync.py rebrand --store "$GITHUB_WORKSPACE" --target "$target" --push

        '
