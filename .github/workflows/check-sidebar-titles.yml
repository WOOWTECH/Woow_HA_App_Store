name: Check sidebar titles
on:
  push:
    paths:
      - '**/config.yaml'
      - '.github/scripts/sidebar_titles.py'
      - '.github/workflows/check-sidebar-titles.yml'
  pull_request:
    paths:
      - '**/config.yaml'
      - '.github/scripts/sidebar_titles.py'
      - '.github/workflows/check-sidebar-titles.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/sidebar_titles.py --check
