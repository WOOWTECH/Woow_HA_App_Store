name: HAOS Enrollment Bridge
version: 0.1.1
slug: haos_enrollment_bridge
description: Converts Dnsmasq-DHCP lease snapshots into durable Home Assistant candidate events.
url: https://github.com/WOOWTECH/haos-enrollment-bridge
stage: stable
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
options:
  dnsmasq_ws_url: ws://192.168.50.1:8976/ws
  ingress_path: /
  target_cidr: 192.168.50.0/24
  event_type: haos_dhcp_candidate
  bootstrap_targets: []
  log_level: info
schema:
  dnsmasq_ws_url: url
  ingress_path: str
  target_cidr: str
  event_type: str
  bootstrap_targets:
    - str
  log_level: list(debug|info|warning|error)
