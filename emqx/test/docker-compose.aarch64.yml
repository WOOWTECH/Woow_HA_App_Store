name: emqx-aarch64
services:
  emqx-aarch64:
    image: woowtech/woow-emqx:${VERSION:-latest}-aarch64
    build:
      context: ..
      args:
        BUILD_ARCH: aarch64
        BUILD_VERSION: ${VERSION:-latest}
    container_name: emqx-aarch64
    network_mode: host
    environment:
      - TZ=Asia/Taipei
    volumes:
      - data:/data
      - ./options.json:/data/options.json:ro
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18083 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  data:
  config:
